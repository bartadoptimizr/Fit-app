<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>FitStart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14202B; --muted:#6C7885; --line:#E6EAEF; --card:#FFFFFF;
    --accent:#FF5630; --accent-soft:#FFEDE7;
    --mint:#0FB981; --mint-soft:#E3F7EF;
    --blue:#2B6DE0; --blue-soft:#E7EFFC;
    --purple:#7A5AF0; --purple-soft:#EDE9FD;
    --shadow:0 6px 24px rgba(20,32,43,.08); --shadow-lg:0 18px 50px rgba(20,32,43,.18);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:'Inter',system-ui,sans-serif;color:var(--ink);background:#DDE2E8;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
  #app{max-width:460px;margin:0 auto;height:100vh;height:100dvh;background:linear-gradient(180deg,#F7F8FA 0%,#EEF1F5 100%);position:relative;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);overflow:hidden}
  .scroll{flex:1;overflow-y:auto;padding:22px 20px 108px;-webkit-overflow-scrolling:touch}
  .head{padding:6px 2px 16px}
  .kicker{font-family:'Space Grotesk';font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
  .head h1{font-family:'Bricolage Grotesque';font-weight:800;font-size:30px;line-height:1.05;margin:6px 0 0;letter-spacing:-.02em}
  .head p{margin:6px 0 0;color:var(--muted);font-size:14px}
  h2.sec{font-family:'Bricolage Grotesque';font-weight:700;font-size:15px;margin:24px 2px 12px;display:flex;align-items:center;justify-content:space-between}
  .card{background:var(--card);border-radius:20px;box-shadow:var(--shadow)}
  .toggle{display:flex;background:#E7EBF0;border-radius:14px;padding:4px;margin:2px 0 4px}
  .toggle button{flex:1;padding:10px 4px;border-radius:11px;font-weight:600;font-size:13px;color:var(--muted);white-space:nowrap}
  .toggle button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(20,32,43,.1)}
  .today{padding:22px;border-radius:24px;color:#fff;position:relative;overflow:hidden;background:radial-gradient(120% 140% at 90% 0%, #FF7A4D 0%, #FF5630 55%, #E23E1E 100%);box-shadow:0 14px 34px rgba(255,86,48,.34)}
  .today.gym{background:radial-gradient(120% 140% at 90% 0%, #9B84F5 0%, #7A5AF0 55%, #5B3FD4 100%);box-shadow:0 14px 34px rgba(122,90,240,.34)}
  .today.cardio{background:radial-gradient(120% 140% at 90% 0%, #34D399 0%, #0FB981 55%, #0A8F63 100%);box-shadow:0 14px 34px rgba(15,185,129,.34)}
  .today .tag{display:inline-block;font-family:'Space Grotesk';font-weight:600;font-size:11px;letter-spacing:.12em;text-transform:uppercase;background:rgba(255,255,255,.22);padding:5px 10px;border-radius:100px}
  .today h3{font-family:'Bricolage Grotesque';font-weight:800;font-size:24px;margin:14px 0 6px}
  .today .meta{font-size:13px;opacity:.92;font-weight:500}
  .today .go{margin-top:18px;background:#fff;color:var(--accent);font-weight:700;font-size:15px;padding:13px 18px;border-radius:14px;display:flex;align-items:center;gap:8px;width:100%;justify-content:center}
  .today.gym .go{color:var(--purple)} .today.cardio .go{color:var(--mint)}
  .today .blob{position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.12)}
  .rlist{display:flex;flex-direction:column;gap:12px}
  .routine{display:flex;align-items:center;gap:14px;padding:14px;text-align:left;width:100%;border-radius:18px}
  .routine .ic{width:52px;height:52px;border-radius:15px;flex-shrink:0;display:grid;place-items:center;font-size:24px}
  .routine .body{flex:1;min-width:0}
  .routine .body .n{font-weight:700;font-size:16px}
  .routine .body .m{color:var(--muted);font-size:13px;margin-top:2px}
  .chev{color:var(--muted);flex-shrink:0}
  .statrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  .stat{padding:16px 14px;border-radius:18px;text-align:center}
  .stat .v{font-family:'Space Grotesk';font-weight:700;font-size:26px;line-height:1}
  .stat .l{font-size:12px;color:var(--muted);margin-top:6px;font-weight:500}
  .stat.flame .v{color:var(--accent)} .stat.mint .v{color:var(--mint)}
  .weekstrip{display:flex;justify-content:space-between;gap:6px;padding:18px 16px}
  .day{flex:1;text-align:center}
  .day .dot{width:30px;height:30px;border-radius:50%;margin:0 auto 7px;display:grid;place-items:center;background:#EEF1F5;color:var(--muted);font-size:13px;font-weight:600}
  .day.trained .dot{background:var(--mint);color:#fff}
  .day.td .dot{box-shadow:0 0 0 3px var(--mint-soft)}
  .day .dl{font-size:11px;color:var(--muted);font-weight:600}
  .barchart{display:flex;align-items:flex-end;gap:8px;height:110px;padding:16px 16px 0}
  .bar-wrap{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
  .bar{width:100%;max-width:26px;background:var(--mint);border-radius:7px 7px 4px 4px;min-height:4px}
  .bar.empty{background:#EAEEF2}
  .bar-l{font-size:11px;color:var(--muted);font-weight:600}
  .history{display:flex;flex-direction:column}
  .hitem{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line)}
  .hitem:last-child{border-bottom:none}
  .hitem .hic{width:38px;height:38px;border-radius:11px;background:var(--accent-soft);display:grid;place-items:center;font-size:18px}
  .hitem .hn{font-weight:600;font-size:14px} .hitem .hd{font-size:12px;color:var(--muted)}
  .hitem .hm{margin-left:auto;font-size:13px;font-weight:600;color:var(--muted)}
  .wtop{display:flex;align-items:flex-end;gap:14px;padding:20px 18px 6px}
  .wtop .big{font-family:'Space Grotesk';font-weight:700;font-size:40px;line-height:.9;color:var(--blue)}
  .wtop .unit{font-size:16px;color:var(--muted);font-weight:600;margin-left:4px}
  .wtop .delta{font-size:13px;font-weight:600;padding:4px 9px;border-radius:100px;margin-bottom:6px}
  .delta.down{background:var(--mint-soft);color:var(--mint)} .delta.up{background:#FDEBE8;color:var(--accent)} .delta.flat{background:#EEF1F5;color:var(--muted)}
  .wchart{padding:8px 8px 4px} .wempty{padding:26px 20px;text-align:center;color:var(--muted);font-size:14px;line-height:1.5}
  .goalbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-top:1px solid var(--line)}
  .goalbar .gt{font-size:13px;color:var(--muted)} .goalbar .gt b{color:var(--ink);font-weight:700}
  .linkbtn{color:var(--blue);font-weight:600;font-size:13px}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:15px;padding:14px 18px;border-radius:14px;width:100%}
  .btn.blue{background:var(--blue);color:#fff} .btn.accent{background:var(--accent);color:#fff}
  .btn.purple{background:var(--purple);color:#fff} .btn.mint{background:var(--mint);color:#fff}
  .btn.ghost{background:#fff;color:var(--ink);box-shadow:var(--shadow)} .btn.grey{background:#EEF1F5;color:var(--ink)}
  /* chips */
  .segwrap{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px;scrollbar-width:none}
  .segwrap::-webkit-scrollbar{display:none}
  .seg{flex-shrink:0;padding:9px 15px;border-radius:100px;background:#fff;color:var(--muted);font-weight:600;font-size:14px;box-shadow:var(--shadow)}
  .seg.on{background:var(--mint);color:#fff;box-shadow:0 8px 20px rgba(15,185,129,.3)}
  .seg.acc.on{background:var(--accent);box-shadow:0 8px 20px rgba(255,86,48,.3)}
  .meal{padding:14px;border-radius:18px;text-align:left;width:100%;display:flex;align-items:center;gap:14px}
  .meal .me{width:48px;height:48px;border-radius:14px;background:var(--mint-soft);display:grid;place-items:center;font-size:24px;flex-shrink:0}
  .meal .mn{font-weight:700;font-size:15px} .meal .md{font-size:12px;color:var(--muted);margin-top:3px}
  .heart{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex-shrink:0;background:#F4F6F8}
  .heart svg{width:20px;height:20px} .heart.on{background:var(--accent-soft)}
  .daymenu{padding:6px 16px}
  .daymenu .dm-row{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);text-align:left;width:100%}
  .daymenu .dm-row:last-child{border-bottom:none}
  .daymenu .dm-e{font-size:26px;width:40px;text-align:center;flex-shrink:0}
  .daymenu .dm-cat{font-size:11px;font-weight:700;color:var(--mint);letter-spacing:.06em;text-transform:uppercase}
  .daymenu .dm-n{font-weight:600;font-size:14px;margin-top:2px}
  /* steps */
  .steps-card{padding:20px}
  .steps-top{display:flex;align-items:flex-end;justify-content:space-between}
  .steps-big{font-family:'Space Grotesk';font-weight:700;font-size:36px;color:var(--mint);line-height:.9}
  .steps-big .su{font-size:15px;color:var(--muted);margin-left:6px;font-weight:600}
  .steps-goal{font-size:13px;color:var(--muted);font-weight:600;text-align:right}
  .pbar{height:12px;background:#E7EBF0;border-radius:100px;overflow:hidden;margin:16px 0 4px}
  .pbar>div{height:100%;background:linear-gradient(90deg,#34D399,#0FB981);border-radius:100px;transition:width .4s ease}
  .steps-btns{display:flex;gap:10px;margin-top:16px}
  .steps-btns button{flex:1;padding:12px;border-radius:12px;font-weight:700;font-size:14px}
  .mini7{display:flex;gap:7px;align-items:flex-end;height:60px;margin-top:20px}
  .mini7 .mb{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
  .mini7 .mbar{width:100%;max-width:22px;border-radius:6px;background:var(--mint);min-height:4px}
  .mini7 .mbar.empty{background:#EAEEF2}
  .mini7 .ml{font-size:10px;color:var(--muted);font-weight:600}
  .clog{padding:14px;border-radius:16px;text-align:left;width:100%;display:flex;align-items:center;gap:14px}
  .clog .ce{width:46px;height:46px;border-radius:13px;background:var(--mint-soft);display:grid;place-items:center;font-size:22px;flex-shrink:0}
  .clog .cn{font-weight:700;font-size:15px} .clog .plus{margin-left:auto;color:var(--mint);font-weight:700;font-size:22px}
  .nav{position:absolute;left:0;right:0;bottom:0;display:flex;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom));transition:transform .28s ease;z-index:30}
  .nav.hidden{transform:translateY(115%)}
  .nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 2px;color:var(--muted);font-size:11px;font-weight:600;border-radius:12px}
  .nav button.on{color:var(--accent)} .nav button svg{width:24px;height:24px}
  .overlay{position:absolute;inset:0;background:linear-gradient(180deg,#F7F8FA 0%,#EEF1F5 100%);z-index:40;display:flex;flex-direction:column;animation:slideup .28s cubic-bezier(.2,.8,.2,1)}
  @keyframes slideup{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .ohead{display:flex;align-items:center;gap:12px;padding:18px 18px 8px}
  .iconbtn{width:40px;height:40px;border-radius:12px;background:#fff;box-shadow:var(--shadow);display:grid;place-items:center}
  .oscroll{flex:1;overflow-y:auto;padding:8px 20px 28px}
  .detail-hero{padding:22px;border-radius:22px;color:#fff;background:radial-gradient(120% 140% at 90% 0%, #FF7A4D 0%, #FF5630 60%, #E23E1E 100%);box-shadow:0 14px 34px rgba(255,86,48,.3)}
  .detail-hero.gym{background:radial-gradient(120% 140% at 90% 0%, #9B84F5 0%, #7A5AF0 60%, #5B3FD4 100%);box-shadow:0 14px 34px rgba(122,90,240,.3)}
  .detail-hero.cardio{background:radial-gradient(120% 140% at 90% 0%, #34D399 0%, #0FB981 60%, #0A8F63 100%);box-shadow:0 14px 34px rgba(15,185,129,.3)}
  .detail-hero h2{font-family:'Bricolage Grotesque';font-weight:800;font-size:26px;margin:10px 0 6px}
  .detail-hero .meta{font-size:14px;opacity:.92;font-weight:500}
  .steplist{margin-top:2px}
  .step-r{display:flex;align-items:center;gap:14px;padding:12px 4px;border-bottom:1px solid var(--line)}
  .step-r:last-child{border-bottom:none}
  .step-r .si{font-family:'Space Grotesk';font-weight:700;color:var(--muted);width:22px;font-size:14px}
  .step-r .sn{font-weight:600;font-size:15px} .step-r .sc{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.35}
  .step-r .st{margin-left:auto;font-family:'Space Grotesk';font-weight:600;font-size:13px;color:var(--accent);flex-shrink:0}
  .step-r.rest .st{color:var(--mint)}
  .newbadge{display:inline-block;font-size:10px;font-weight:700;color:#fff;background:var(--mint);padding:2px 7px;border-radius:100px;margin-left:8px;vertical-align:middle;letter-spacing:.04em}
  .sticky-cta{padding:12px 20px calc(18px + env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent,#EEF1F5 30%);display:flex;flex-direction:column;gap:10px}
  .clbar{height:8px;background:#E7EBF0;border-radius:100px;overflow:hidden;margin:2px 4px 14px}
  .clbar > div{height:100%;background:var(--mint);border-radius:100px;transition:width .3s ease;width:0}
  .clrow{display:flex;align-items:center;gap:14px;padding:14px;border-radius:16px;text-align:left;width:100%;margin-bottom:10px;background:#fff;box-shadow:var(--shadow)}
  .clrow .box{width:30px;height:30px;border-radius:9px;border:2px solid var(--line);flex-shrink:0;display:grid;place-items:center;color:transparent;transition:.15s}
  .clrow.on .box{background:var(--mint);border-color:var(--mint);color:#fff}
  .clrow.on .cn{color:var(--muted);text-decoration:line-through}
  .clrow .cn{font-weight:600;font-size:15px} .clrow .cc{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.35}
  .clrow .cq{margin-left:auto;font-family:'Space Grotesk';font-weight:700;font-size:14px;color:var(--purple);flex-shrink:0}
  .player{position:absolute;inset:0;z-index:50;background:var(--ink);color:#fff;display:flex;flex-direction:column;animation:fade .2s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .player.rest{background:#0C2A22}
  .ptop{display:flex;align-items:center;justify-content:space-between;padding:20px 22px 6px}
  .ptop .prog{font-family:'Space Grotesk';font-weight:600;font-size:14px;letter-spacing:.04em;color:rgba(255,255,255,.7)}
  .ptop .quit{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.12);display:grid;place-items:center;color:#fff}
  .ring-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:0 24px}
  .ring{position:relative;width:262px;height:262px}
  .ring svg{transform:rotate(-90deg)}
  .ring .rbg{fill:none;stroke:rgba(255,255,255,.12);stroke-width:14}
  .ring .rfg{fill:none;stroke:var(--accent);stroke-width:14;stroke-linecap:round;transition:stroke-dashoffset 1s linear}
  .player.rest .ring .rfg{stroke:var(--mint)}
  .ring .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring .center .num{font-family:'Space Grotesk';font-weight:700;font-size:64px;line-height:1;font-variant-numeric:tabular-nums}
  .ring .center .ph{font-family:'Space Grotesk';font-weight:600;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.6);margin-top:8px}
  .exinfo{text-align:center;min-height:96px}
  .exinfo .exn{font-family:'Bricolage Grotesque';font-weight:800;font-size:28px}
  .exinfo .exc{font-size:14px;color:rgba(255,255,255,.72);margin-top:8px;line-height:1.45;max-width:320px}
  .nextup{text-align:center;font-size:13px;color:rgba(255,255,255,.5);font-weight:500}
  .nextup b{color:rgba(255,255,255,.8);font-weight:600}
  .pctrl{display:flex;gap:14px;padding:18px 24px calc(26px + env(safe-area-inset-bottom))}
  .pctrl button{flex:1;padding:16px;border-radius:16px;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px}
  .pctrl .pause{background:rgba(255,255,255,.14);color:#fff} .pctrl .skip{background:#fff;color:var(--ink)}
  .done{position:absolute;inset:0;z-index:55;background:linear-gradient(180deg,#0FB981,#0A8F63);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:36px;animation:fade .3s ease;overflow-y:auto}
  .done .check{width:88px;height:88px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;margin-bottom:20px;animation:pop .4s cubic-bezier(.2,1.3,.4,1) both}
  @keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
  .done h2{font-family:'Bricolage Grotesque';font-weight:800;font-size:30px;margin:0 0 8px}
  .done p{font-size:15px;opacity:.9;margin:0 0 6px;max-width:290px;line-height:1.5}
  .done .stats{display:flex;gap:24px;margin:18px 0 22px}
  .done .stats .s .v{font-family:'Space Grotesk';font-weight:700;font-size:28px}
  .done .stats .s .l{font-size:12px;opacity:.85;margin-top:2px}
  .fbwrap{width:100%;max-width:320px}
  .fblabel{font-size:13px;opacity:.9;margin-bottom:10px;font-weight:600}
  .fbrow{display:flex;gap:10px}
  .fbrow button{flex:1;padding:12px 6px;border-radius:13px;background:rgba(255,255,255,.16);color:#fff;font-weight:600;font-size:13px;border:1.5px solid rgba(255,255,255,.25)}
  .done .backbtn{background:#fff;color:#0A8F63;font-weight:700;font-size:16px;padding:15px 40px;border-radius:16px;margin-top:8px}
  .sheet-scrim{position:absolute;inset:0;background:rgba(20,32,43,.45);z-index:60;display:flex;align-items:flex-end;animation:fade .2s ease}
  .sheet{background:#fff;width:100%;border-radius:24px 24px 0 0;padding:22px 22px calc(24px + env(safe-area-inset-bottom));animation:slideup .28s cubic-bezier(.2,.8,.2,1)}
  .sheet h3{font-family:'Bricolage Grotesque';font-weight:800;font-size:20px;margin:0 0 4px}
  .sheet p{color:var(--muted);font-size:13px;margin:0 0 18px}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:7px}
  .field input{width:100%;font-family:'Space Grotesk';font-weight:600;font-size:18px;padding:14px 16px;border:1.5px solid var(--line);border-radius:14px;background:#F7F8FA;color:var(--ink)}
  .field input:focus{border-color:var(--blue);background:#fff;outline:none}
  .sheet-btns{display:flex;gap:10px;margin-top:6px} .sheet-btns .btn{flex:1}
  .empty-note{color:var(--muted);font-size:14px;text-align:center;padding:20px;line-height:1.5}
  .ownbtn{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border-radius:18px;background:#fff;box-shadow:var(--shadow);text-align:left;margin:8px 0 2px}
  .ownbtn .oi{width:46px;height:46px;border-radius:13px;background:linear-gradient(135deg,#FF7A4D,#7A5AF0);display:grid;place-items:center;font-size:22px;flex-shrink:0}
  .btabs{display:flex;background:#E7EBF0;border-radius:12px;padding:4px;margin-bottom:4px}
  .btabs button{flex:1;padding:10px;border-radius:10px;font-weight:600;font-size:14px;color:var(--muted)}
  .btabs button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(20,32,43,.1)}
  .blabel{font-size:13px;font-weight:700;color:var(--ink);margin:18px 2px 2px}
  .bgroup{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 2px}
  .bchip{padding:9px 14px;border-radius:100px;background:#F4F6F8;color:var(--muted);font-weight:600;font-size:13px}
  .bchip.on{background:var(--accent);color:#fff}
  .libitem{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:#fff;box-shadow:var(--shadow);margin-bottom:8px;text-align:left;width:100%}

function figPose(o,color,w){
  const p=Object.assign({},FIG_BASE,o);
  return `<g stroke="${color}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">`+
   `<circle cx="${p.head[0]}" cy="${p.head[1]}" r="${p.hr||13}" fill="${color}" stroke="none"/>`+

}
function figArrow(a,b,color){
  const dx=b[0]-a[0],dy=b[1]-a[1],len=Math.hypot(dx,dy);if(len<12)return '';
  const ux=dx/len,uy=dy/len,sx=a[0]+ux*13,sy=a[1]+uy*13,ex=b[0]-ux*7,ey=b[1]-uy*7;
  const ang=Math.atan2(ey-sy,ex-sx),h=9;
  const p1x=ex-h*Math.cos(ang-0.45),p1y=ey-h*Math.sin(ang-0.45),p2x=ex-h*Math.cos(ang+0.45),p2y=ey-h*Math.sin(ang+0.45);
  return `<line x1="${sx.toFixed(1)}" y1="${sy.toFixed(1)}" x2="${ex.toFixed(1)}" y2="${ey.toFixed(1)}" stroke="${color}" stroke-width="3.5" stroke-linecap="round"/><polygon points="${ex.toFixed(1)},${ey.toFixed(1)} ${p1x.toFixed(1)},${p1y.toFixed(1)} ${p2x.toFixed(1)},${p2y.toFixed(1)}" fill="${color}"/>`;
}

  const A=Object.assign({},FIG_BASE,m.A||{}),B=Object.assign({},FIG_BASE,m.B||{});
  let best=null,bd=0;['head','rh','lh','hip','rf','lf','le','re'].forEach(k=>{const a=A[k],b=B[k];if(a&&b){const d=Math.hypot(b[0]-a[0],b[1]-a[1]);if(d>bd){bd=d;best=k;}}});
  const arrow=best?figArrow(A[best],B[best],c):'';
  const bar=(key==='pullup'||key==='hang')?'<line x1="62" y1="28" x2="138" y2="28" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>':'';

const SKEY='fitstart:data';

const hasClaude=typeof window!=='undefined'&&window.storage&&typeof window.storage.get==='function';
function lsOK(){try{localStorage.setItem('__t','1');localStorage.removeItem('__t');return true;}catch(e){return false;}}
const MODE=hasClaude?'claude':(lsOK()?'local':'memory');
let DB={history:[],weights:[],goalKg:null,savedMeals:[],diffFactor:1,steps:{},stepGoal:8000,exWeights:{},customMeals:[]};
async function loadDB(){try{if(MODE==='claude'){const r=await window.storage.get(SKEY);if(r&&r.value)Object.assign(DB,JSON.parse(r.value));}else if(MODE==='local'){const v=localStorage.getItem(SKEY);if(v)Object.assign(DB,JSON.parse(v));}}catch(e){}sanitizeDB();}
function sanitizeDB(){
  if(!Array.isArray(DB.history))DB.history=[];
  DB.history=DB.history.filter(h=>h&&typeof h==='object'&&typeof h.date==='string').map(h=>({date:h.date,id:h.id,name:h.name||'Workout',min:Number(h.min)||0,emoji:h.emoji||'\uD83D\uDD25',met:(h.met!=null&&!isNaN(Number(h.met)))?Number(h.met):undefined}));
  if(!Array.isArray(DB.weights))DB.weights=[];
  DB.weights=DB.weights.filter(w=>w&&typeof w.date==='string'&&!isNaN(Number(w.kg))).map(w=>({date:w.date,kg:Number(w.kg)}));
  if(!DB.steps||typeof DB.steps!=='object'||Array.isArray(DB.steps))DB.steps={};
  if(!Array.isArray(DB.savedMeals))DB.savedMeals=[];
  if(!Array.isArray(DB.customMeals))DB.customMeals=[];
  if(!DB.exWeights||typeof DB.exWeights!=='object'||Array.isArray(DB.exWeights))DB.exWeights={};
  DB.diffFactor=Number(DB.diffFactor)||1;
  DB.stepGoal=Number(DB.stepGoal)||8000;
  if(DB.goalKg!=null&&isNaN(Number(DB.goalKg)))DB.goalKg=null;
}
async function saveDB(){try{if(MODE==='claude')await window.storage.set(SKEY,JSON.stringify(DB));else if(MODE==='local')localStorage.setItem(SKEY,JSON.stringify(DB));}catch(e){}}

const fmtTime=s=>`${Math.floor(s/60)}:${pad(s%60)}`;
const todayISO=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;};
const keyOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const DAYNL=['Zo','Ma','Di','Wo','Do','Vr','Za'];
const MNL=['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
function isoWeek(d=new Date()){const t=new Date(d);t.setHours(0,0,0,0);t.setDate(t.getDate()+3-((t.getDay()+6)%7));const w1=new Date(t.getFullYear(),0,4);return 1+Math.round(((t-w1)/86400000-3+((w1.getDay()+6)%7))/7);}
function dayOfYear(d=new Date()){return Math.floor((d-new Date(d.getFullYear(),0,0))/86400000);}
function greeting(){const h=new Date().getHours();return h<6?'Goedenacht':h<12?'Goedemorgen':h<18?'Goedemiddag':'Goedenavond';}
function stepsFor(r){
  const f=DB.diffFactor||1;
  let out=r.steps.map(s=>{
    if(s.kind==='rest')return {...s};
    if(s.reps){const d=Math.round((f-1)*10);return {...s,reps:Math.max(6,Math.min(20,s.reps+d))};}
    return {...s,seconds:Math.max(10,Math.round(s.seconds*f))};
  });
  if(r.type==='time'&&HOME.some(x=>x.id===r.id)){
    const b={...BONUS[(isoWeek()+HOME.findIndex(x=>x.id===r.id))%BONUS.length],isNew:true};
    b.seconds=Math.max(10,Math.round(b.seconds*f));
    out.splice(out.length-1,0,RS(15),b);
  }
  return out;
}
function totalMin(r){return Math.round(stepsFor(r).reduce((a,s)=>a+(s.seconds||0),0)/60);}
function exCount(r){return stepsFor(r).filter(s=>s.kind==='exercise').length;}
function computeStreak(){const set=new Set(DB.history.map(h=>h.date));if(!set.size)return 0;let streak=0,cur=new Date();if(!set.has(keyOf(cur))){cur.setDate(cur.getDate()-1);if(!set.has(keyOf(cur)))return 0;}while(set.has(keyOf(cur))){streak++;cur.setDate(cur.getDate()-1);}return streak;}
function weekDates(){const now=new Date();const day=(now.getDay()+6)%7;const mon=new Date(now);mon.setDate(now.getDate()-day);return Array.from({length:7},(_,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return d;});}
function last7(){return Array.from({length:7},(_,i)=>{const d=new Date();d.setDate(d.getDate()-(6-i));return d;});}
/* calories */
const MET_MACHINE={c_walk:3.5,c_run:9.8,c_bike:7,c_rope:11,c_swim:7,c_stairs:8,c_row:7,c_ski:7,c_tread:9,c_spin:7,c_cross:7};
function bodyKg(){if(DB.weights&&DB.weights.length){const w=[...DB.weights].sort((a,b)=>a.date.localeCompare(b.date));return w[w.length-1].kg;}return 70;}
function metFor(h){if(h.met!=null)return h.met;if(MET_MACHINE[h.id]!=null)return MET_MACHINE[h.id];if(h.id==='cardio_hiit')return 8;if(h.id==='cardio_low')return 5;if(h.id==='mobility')return 2.5;return 5;}
function kcalOf(h){return Math.round(metFor(h)*bodyKg()*((h.min||0)/60));}
function dateLabel(iso){const d=new Date(iso+'T00:00');const y=new Date();y.setDate(y.getDate()-1);if(iso===todayISO())return 'Vandaag';if(iso===keyOf(y))return 'Gisteren';return `${DAYNL[d.getDay()].toLowerCase()} ${d.getDate()} ${MNL[d.getMonth()]}`;}

/* ============ STATE ============ */
let TAB='trainen', LOC='thuis', MCAT='vandaag', GROUP='alles', HTAB='workouts', EQUIP='zonder';
let sound=null,pendingCardio=null;
function beep(freq=660,dur=0.12){try{if(!sound)sound=new (window.AudioContext||window.webkitAudioContext)();const o=sound.createOscillator(),g=sound.createGain();o.frequency.value=freq;o.type='sine';o.connect(g);g.connect(sound.destination);g.gain.setValueAtTime(0.14,sound.currentTime);g.gain.exponentialRampToValueAtTime(0.0001,sound.currentTime+dur);o.start();o.stop(sound.currentTime+dur);}catch(e){}}
function routineById(id){if(id==='custom')return CUSTOM;return HOME.find(r=>r.id===id)||GYM.find(r=>r.id===id)||CARDIO_WORKOUTS.find(r=>r.id===id)||CALIS.find(r=>r.id===id);}

/* ============ VOORTGANG ============ */

  const wk=weekDates(),doneSet=new Set(DB.history.map(h=>h.date)),t=todayISO();
  const byDate={};DB.history.forEach(h=>{(byDate[h.date]=byDate[h.date]||[]).push(h);});
  const dates=Object.keys(byDate).sort((a,b)=>b.localeCompare(a)).slice(0,10);
  const diffTxt=DB.diffFactor>1.05?'pittiger':DB.diffFactor<0.95?'rustiger':'op maat';

    const items=byDate[dt];const dk=items.reduce((a,h)=>a+kcalOf(h),0);

  }).join(''):`<div class="card"><div class="empty-note">Nog geen trainingen. Start er eentje op het tabblad <b>Trainen</b> \uD83D\uDCAA</div></div>`;
  scrollEl().innerHTML=`
    <div class="head"><div class="kicker" style="color:var(--mint)">Jouw voortgang</div><h1>Zo gaat het</h1><p>Kleine stapjes tellen op. Blijf gewoon in beweging.</p></div>

    <h2 class="sec">Training per dag<button class="linkbtn" data-act="addact" style="color:var(--accent)">+ Toevoegen</button></h2>${daysHTML}

}

/* ============ GEWICHT ============ */
function renderGewicht(){
  const w=[...DB.weights].sort((a,b)=>a.date.localeCompare(b.date));
  const cur=w.length?w[w.length-1].kg:null,first=w.length?w[0].kg:null;
  let deltaHTML='';
  if(w.length>1){const diff=+(cur-first).toFixed(1);const cls=diff<0?'down':diff>0?'up':'flat';const txt=diff<0?`${Math.abs(diff)} kg omlaag`:diff>0?`${diff} kg omhoog`:'gelijk gebleven';deltaHTML=`<span class="delta ${cls}">${txt}</span>`;}
  let goalHTML;
  if(DB.goalKg&&cur!=null){const rem=+(cur-DB.goalKg).toFixed(1);goalHTML=rem>0?`<div class="goalbar"><div class="gt">Nog <b>${rem} kg</b> tot je doel van ${DB.goalKg} kg</div><button class="linkbtn" data-act="sheet:goal">Wijzig</button></div>`:`<div class="goalbar"><div class="gt">\uD83C\uDF89 Je bent op of onder je doel van <b>${DB.goalKg} kg</b>!</div><button class="linkbtn" data-act="sheet:goal">Wijzig</button></div>`;}
  else goalHTML=`<div class="goalbar"><div class="gt">Stel een vrijblijvend streefgewicht in</div><button class="linkbtn" data-act="sheet:goal">Instellen</button></div>`;
  scrollEl().innerHTML=`
    <div class="head"><div class="kicker" style="color:var(--blue)">Gewicht</div><h1>Volg je trend</h1><p>Kijk naar de lijn over weken, niet naar één dag. Gewicht wisselt van nature.</p></div>
    <div class="card">${cur!=null?`<div class="wtop"><div><span class="big">${cur}</span><span class="unit">kg</span></div>${deltaHTML}</div><div class="wchart">${weightChart(w)}</div>`:`<div class="wempty">Nog geen metingen.<br>Log je gewicht om je trend te zien.</div>`}${goalHTML}</div>
    <div style="height:16px"></div>
    <button class="btn blue" data-act="sheet:weight">+ Gewicht loggen</button>
    <p style="text-align:center;color:var(--muted);font-size:12px;margin-top:16px;line-height:1.5">Tip: weeg jezelf het liefst op een vast moment. Gezond afvallen gaat geleidelijk — wees mild voor jezelf.</p>`;
}
function weightChart(w){
  if(w.length<2)return `<div class="wempty" style="padding:16px">Log minstens twee metingen voor een grafiek.</div>`;
  const W=380,H=150,p=14;const kgs=w.map(x=>x.kg).concat(DB.goalKg?[DB.goalKg]:[]);let min=Math.min(...kgs),max=Math.max(...kgs);if(max-min<2){const c=(max+min)/2;min=c-1.5;max=c+1.5;}const rng=max-min;
  const x=i=>p+(i/(w.length-1))*(W-2*p),y=v=>p+(1-(v-min)/rng)*(H-2*p);
  const pts=w.map((q,i)=>`${x(i).toFixed(1)},${y(q.kg).toFixed(1)}`).join(' ');
  const area=`${p},${H-p} ${pts} ${W-p},${H-p}`;
  const gl=DB.goalKg?`<line x1="${p}" y1="${y(DB.goalKg).toFixed(1)}" x2="${W-p}" y2="${y(DB.goalKg).toFixed(1)}" stroke="var(--mint)" stroke-width="1.5" stroke-dasharray="5 5"/><text x="${W-p}" y="${(y(DB.goalKg)-6).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--mint)" font-family="Space Grotesk" font-weight="600">doel ${DB.goalKg}</text>`:'';
  const dots=w.map((q,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(q.kg).toFixed(1)}" r="3.5" fill="#fff" stroke="var(--blue)" stroke-width="2"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block"><defs><linearGradient id="wg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--blue)" stop-opacity="0.18"/><stop offset="1" stop-color="var(--blue)" stop-opacity="0"/></linearGradient></defs><polygon points="${area}" fill="url(#wg)"/>${gl}<polyline points="${pts}" fill="none" stroke="var(--blue)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>${dots}</svg>`;
}

/* ============ ETEN ============ */
function renderEten(){
  const saved=new Set(DB.savedMeals);let body='';
  if(MCAT==='vandaag'){

    const menu=[['ontbijt',pick(MEALS.ontbijt,0)],['lunch',pick(MEALS.lunch,1)],['diner',pick(MEALS.diner,2)],['snacks',pick(MEALS.snacks,3)]];

  scrollEl().innerHTML=`<div class="head"><div class="kicker" style="color:var(--mint)">Gezond eten</div><h1>Lekker &amp; simpel</h1><p>Gebalanceerde ideeën voor elke dag, met voedingswaarde per portie.</p></div><div class="segwrap">${MEAL_CATS.map(([k,l])=>`<button class="seg ${MCAT===k?'on':''}" data-act="mcat:${k}">${l}${k==='bewaard'&&DB.savedMeals.length?` (${DB.savedMeals.length})`:''}</button>`).join('')}</div><div style="margin-top:6px">${addBtn}${body}</div>`;
}

/* ============ OVERLAYS ============ */
function closeOverlays(){document.querySelectorAll('.overlay,.player,.done,.sheet-scrim,.checklist').forEach(e=>e.remove());}
function openRoutine(id){
  const r=routineById(id);if(!r)return;CUR_DETAIL=id;closeOverlays();
  const gym=r.type==='reps';const cardio=!!r.cardio;const steps=stepsFor(r);let n=0;
  const rows=steps.map(s=>{
    if(s.kind==='rest')return `<div class="step-r rest"><div class="si">·</div><div><div class="sn" style="color:var(--muted)">Rust</div></div><div class="st">${s.seconds}s</div></div>`;
    n++;
    const info=s.cardioNote?'':`<span class="infob" style="margin-left:8px">${IINFO}</span>`;
    if(s.reps){
      const w=weightOf(s.name);const rp=`${s.sets} × ${s.reps}${s.name==='Plank'?'s':''}`;
      const wbtn=`<button class="wpill ${w!=null?'':'light'}" data-act="dw" data-ex="${s.name}">${w!=null?fmtKg(w)+' kg \u270E':'+ kg'}</button>`;
      return `<div class="step-r tap" data-act="exinfo" data-ex="${s.name}"><div class="si">${pad(n)}</div><div style="flex:1;min-width:0"><div class="sn">${s.name}</div><div class="sc">${s.cue}</div></div><div style="display:flex;align-items:center;gap:8px;flex-shrink:0">${wbtn}<span style="font-family:'Space Grotesk';font-weight:600;font-size:13px;color:var(--purple)">${rp}</span>${info}</div></div>`;
    }
    const q=s.cardioNote?`${s.mins} min`:`${s.seconds}s`;
    return `<div class="step-r ${s.cardioNote?'':'tap'}" ${s.cardioNote?'':`data-act="exinfo" data-ex="${s.name}"`}><div class="si">${pad(n)}</div><div style="flex:1;min-width:0"><div class="sn">${s.name}${s.isNew?'<span class="newbadge">Nieuw</span>':''}</div><div class="sc">${s.cue}</div></div><div class="st" style="${cardio?'color:var(--mint)':''}">${q}</div>${info}</div>`;
  }).join('');
  const dmin=gym?Math.max(12,r.steps.length*4):totalMin(r);
  const dmet=cardio?(r.id==='cardio_hiit'?8:5):(r.id==='mobility'?2.5:5);
  const dkcal=Math.round(dmet*bodyKg()*(dmin/60));
  const meta=(gym?`${n} oefeningen · met gewichten`:`${totalMin(r)} min · ${exCount(r)} oefeningen`)+` · ~${dkcal} kcal`;
  const cta=gym?`<button class="btn purple" data-act="checklist:${r.id}">Afvinklijst starten \u2713</button>`:`<button class="btn ${cardio?'mint':'accent'}" data-act="start:${r.id}">Start met timer \uD83D\uDD25</button><button class="btn ghost" data-act="checklist:${r.id}">Afvinklijst \u2713</button>`;
  const hero=gym?'gym':cardio?'cardio':'';
  const el=document.createElement('div');el.className='overlay';el.id='detail';
  el.innerHTML=`<div class="ohead"><button class="iconbtn" data-act="closeov"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button><strong style="font-family:'Bricolage Grotesque';font-size:17px">Workout</strong></div>
    <div class="oscroll"><div class="detail-hero ${hero}"><span class="tag" style="display:inline-block;font-family:'Space Grotesk';font-weight:600;font-size:11px;letter-spacing:.12em;text-transform:uppercase;background:rgba(255,255,255,.22);padding:5px 10px;border-radius:100px">${r.focus}</span><h2>${r.name}</h2><div class="meta">${meta}</div></div>
    <div class="card" style="padding:6px 18px;margin-top:14px"><div class="steplist">${rows}</div></div>
    <p style="text-align:center;color:var(--muted);font-size:12px;margin:16px 6px 0;line-height:1.5">${gym?'Rust ongeveer 60\u201390 sec tussen sets. Tik op een gewicht om je eigen kilo\u2019s in te stellen.':'Luister naar je lichaam. Pauzeer wanneer je wilt en pas oefeningen aan als iets niet fijn voelt.'}</p></div>
    <div class="sticky-cta">${cta}</div>`;
  $('#app').appendChild(el);
}

/* ============ CHECKLIST ============ */
let CL=null;
function openChecklist(id){
  const r=routineById(id);if(!r)return;closeOverlays();
  CL={routine:r,steps:stepsFor(r).filter(s=>s.kind==='exercise'),done:new Set(),msg:{}};
  const el=document.createElement('div');el.className='overlay checklist';el.id='checklist';
  el.innerHTML=`<div class="ohead"><button class="iconbtn" data-act="closeov"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button><strong style="font-family:'Bricolage Grotesque';font-size:17px">${r.name}</strong></div>
    <div class="oscroll"><div class="clbar"><div id="cl-fill"></div></div><div id="cl-count" style="text-align:center;color:var(--muted);font-size:13px;font-weight:600;margin-bottom:16px"></div><div id="cl-list"></div></div>
    <div class="sticky-cta"><button class="btn ${r.type==='reps'?'purple':r.cardio?'mint':'accent'}" data-act="finishcl">Workout afronden</button></div>`;
  $('#app').appendChild(el);drawChecklist();
}
const CHK='<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function drawChecklist(){
  const reps=CL.routine.type==='reps';
  $('#cl-list').innerHTML=CL.steps.map((s,i)=>{
    const on=CL.done.has(i);
    const info=s.cardioNote?'':`<button class="infob" data-act="exinfo" data-ex="${s.name}" aria-label="Beweging">${IINFO}</button>`;
    let meta,right='',wpill='',extra='';
    if(s.cardioNote){meta='Bijv. roeien, loopband of fiets';right=`<span class="cq" style="color:var(--mint)">${s.mins} min</span>`;}
    else if(reps&&s.reps){const w=weightOf(s.name);meta=`${s.sets} × ${s.reps}${s.name==='Plank'?'s':''}`;wpill=`<button class="wpill ${w!=null?'':'light'}" data-act="clw:${i}">${w!=null?fmtKg(w)+' kg \u270E':'eigen gew.'}</button>`;if(CL.msg[i])extra=`<div class="feelmsg">${CL.msg[i]}</div>`;else if(on&&w!=null)extra=`<div class="feelrow"><button data-act="clfeel:${i}:hard">Te zwaar</button><button data-act="clfeel:${i}:good">Goed</button><button data-act="clfeel:${i}:easy">Te licht</button></div>`;}
    else meta=`${s.seconds} sec`;
    return `<div class="clrow2 ${on?'on':''}"><button class="clmain" data-act="cltoggle:${i}"><div class="box">${CHK}</div><div style="min-width:0"><div class="cn">${s.name}${s.isNew?'<span class="newbadge">Nieuw</span>':''}</div><div class="cc">${meta}</div></div></button>${wpill}${right}${info}${extra}</div>`;
  }).join('');
  const pct=Math.round(CL.done.size/CL.steps.length*100);$('#cl-fill').style.width=pct+'%';$('#cl-count').textContent=`${CL.done.size} van ${CL.steps.length} afgevinkt`;
}
function openExInfo(name){const cue=EX_CUE[name]||'Voer de beweging rustig en gecontroleerd uit.';sheetScrim(`<div class="fig-stage">${artFor(name)}</div><div class="fig-legend"><span><span style="background:#B7C0CA"></span>start</span><span><span style="background:var(--accent)"></span>eindpositie</span></div><h3 style="margin-top:14px">${name}</h3><p>${cue}</p><div class="sheet-btns"><button class="btn accent" data-act="closesheet">Sluiten</button></div>`);}
function clWeight(i){const s=CL.steps[i];pendingW={name:s.name};const cur=weightOf(s.name);sheetScrim(`<h3>${s.name}</h3><p>Hoeveel kilo pak je? Je kunt dit altijd aanpassen.</p><div class="field"><label>Gewicht (kg)</label><input id="sh-input" type="number" inputmode="decimal" step="0.5" placeholder="bijv. 8" value="${cur!=null?cur:''}"/></div><div class="sheet-btns"><button class="btn grey" data-act="closesheet">Annuleer</button><button class="btn purple" data-act="saveexw">Opslaan</button></div>`);focusSheet();}
async function clFeel(i,kind){
  const s=CL.steps[i];let w=weightOf(s.name);
  if(w==null){CL.msg[i]='Mooi gedaan \uD83D\uDC4C';drawChecklist();return;}
  if(kind==='easy'){w=+(w+kgStep(w)).toFixed(1);DB.exWeights[s.name]=w;CL.msg[i]=`Volgende keer ${fmtKg(w)} kg proberen \uD83D\uDCAA`;}
  else if(kind==='hard'){w=Math.max(0,+(w-kgStep(w)).toFixed(1));DB.exWeights[s.name]=w;CL.msg[i]=`Volgende keer ${fmtKg(w)} kg — rustig opbouwen`;}
  else{DB.exWeights[s.name]=w;CL.msg[i]='Mooi, dit gewicht past \uD83D\uDC4C';}
  await saveDB();drawChecklist();
}
async function saveExW(){const el=$('#sh-input');const v=parseFloat((el.value||'').replace(',','.'));if(isNaN(v)||v<0||v>200){el.style.borderColor='var(--accent)';return;}DB.exWeights[pendingW.name]=v;await saveDB();closeSheet();if(CL)drawChecklist();if(document.getElementById('detail')&&CUR_DETAIL)openRoutine(CUR_DETAIL);}
function openWeightByName(name){pendingW={name};const cur=weightOf(name);sheetScrim(`<h3>${name}</h3><p>Hoeveel kilo pak je? Je kunt dit altijd aanpassen.</p><div class="field"><label>Gewicht (kg)</label><input id="sh-input" type="number" inputmode="decimal" step="0.5" placeholder="bijv. 8" value="${cur!=null?cur:''}"/></div><div class="sheet-btns"><button class="btn grey" data-act="closesheet">Annuleer</button><button class="btn purple" data-act="saveexw">Opslaan</button></div>`);focusSheet();}
function toggleCL(i){if(CL.done.has(i))CL.done.delete(i);else{CL.done.add(i);beep(760,0.08);}drawChecklist();}

/* ============ TIMER ============ */
let P=null;const RING_R=124,RING_C=2*Math.PI*RING_R;
function startWorkout(id){
  const r=routineById(id);if(!r||r.type!=='time')return;closeOverlays();
  try{if(!sound)sound=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}
  P={routine:r,steps:stepsFor(r),idx:0,left:0,paused:false,timer:null};P.left=P.steps[0].seconds;
  const el=document.createElement('div');el.className='player';el.id='player';
  el.innerHTML=`<div class="ptop"><div class="prog" id="p-prog"></div><button class="quit" data-act="quit"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button></div>
    <div class="ring-wrap"><div class="ring"><svg width="262" height="262" viewBox="0 0 262 262"><circle class="rbg" cx="131" cy="131" r="${RING_R}"/><circle class="rfg" id="p-ring" cx="131" cy="131" r="${RING_R}" stroke-dasharray="${RING_C}" stroke-dashoffset="0"/></svg><div class="center"><div class="num" id="p-num">0</div><div class="ph" id="p-phase">Oefening</div></div></div><div class="exinfo"><div class="exn" id="p-exn"></div><div class="exc" id="p-exc"></div></div><div class="nextup" id="p-next"></div></div>
    <div class="pctrl"><button class="pause" data-act="pause"><span id="p-pausel">Pauze</span></button><button class="skip" data-act="skip">Overslaan \u203A</button></div>`;
  $('#app').appendChild(el);applyStep();tickStart();
}
function nextExName(from){for(let i=from;i<P.steps.length;i++)if(P.steps[i].kind==='exercise')return P.steps[i].name;return null;}
function applyStep(){
  const s=P.steps[P.idx];const isRest=s.kind==='rest';$('#player').classList.toggle('rest',isRest);P.left=s.seconds;
  const exAll=P.steps.filter(x=>x.kind==='exercise');const curNum=P.steps.slice(0,P.idx+1).filter(x=>x.kind==='exercise').length;
  $('#p-prog').textContent=isRest?'Rust':`Oefening ${curNum}/${exAll.length}`;$('#p-phase').textContent=isRest?'Rust':'Oefening';
  const exn=$('#p-exn');
  exn.innerHTML=isRest?'Even rust':(s.name+(s.isNew?'<span class="newbadge">Nieuw</span>':'')+(s.cardioNote?'':' <span class="exhint">\u24D8 beweging</span>'));
  exn.dataset.act=(isRest||s.cardioNote)?'':'exinfo';exn.dataset.ex=s.name;
  $('#p-exc').textContent=isRest?'Adem rustig en herstel.':s.cue;
  const nxt=nextExName(P.idx+1);$('#p-next').innerHTML=nxt?`Volgende: <b>${nxt}</b>`:'Bijna klaar!';
  $('#p-ring').setAttribute('stroke-dashoffset','0');updateNum();beep(isRest?520:760);
}
function updateNum(){const el=$('#p-num');if(!el)return;el.textContent=P.left>=60?fmtTime(P.left):P.left;const s=P.steps[P.idx];const frac=1-(P.left/s.seconds);const ring=$('#p-ring');if(ring)ring.setAttribute('stroke-dashoffset',(RING_C*frac).toFixed(1));}
function tickStart(){clearInterval(P.timer);P.timer=setInterval(()=>{if(P.paused)return;P.left--;if(P.left<=0)advance();else{updateNum();if(P.left<=3)beep(880,0.08);}},1000);}
function advance(){if(P.idx>=P.steps.length-1){clearInterval(P.timer);finishWorkout(P.routine);return;}P.idx++;applyStep();}
function pauseToggle(){P.paused=!P.paused;$('#p-pausel').textContent=P.paused?'Hervat':'Pauze';}
function quitWorkout(){if(P)clearInterval(P.timer);P=null;closeOverlays();}

/* ============ FINISH ============ */
async function finishWorkout(r){
  if(P)clearInterval(P.timer);P=null;CL=null;
  const min=r.type==='reps'?Math.max(12,r.steps.length*4):totalMin(r);
  const met=r.cardio?(r.id==='cardio_hiit'?8:5):(r.id==='mobility'?2.5:5);
  const entry={date:todayISO(),id:r.id,name:r.name,min,emoji:r.emoji,met};
  DB.history.push(entry);await saveDB();
  const streak=computeStreak();const kcal=kcalOf(entry);closeOverlays();
  const el=document.createElement('div');el.className='done';el.id='done';el.dataset.act='donedismiss';
  el.innerHTML=`<div class="check"><svg width="42" height="42" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div><h2>Goed bezig!</h2><p>Je hebt <b>${r.name}</b> afgerond. Elke workout telt.</p><div class="stats"><div class="s"><div class="v">${min}</div><div class="l">minuten</div></div><div class="s"><div class="v">${kcal}</div><div class="l">kcal</div></div><div class="s"><div class="v">${streak}</div><div class="l">reeks</div></div></div><div class="fbwrap" id="fb"><div class="fblabel">Hoe voelde deze workout?</div><div class="fbrow"><button data-act="fb:hard">Te zwaar</button><button data-act="fb:good">Precies goed</button><button data-act="fb:easy">Te makkelijk</button></div></div><p style="font-size:12px;opacity:.75;margin-top:18px">Tik ergens om te sluiten</p>`;
  $('#app').appendChild(el);beep(660,0.14);setTimeout(()=>beep(880,0.18),140);setTimeout(()=>beep(1046,0.24),300);
}
async function feedback(kind){
  if(kind==='easy')DB.diffFactor=Math.min(1.3,(DB.diffFactor||1)+0.1);else if(kind==='hard')DB.diffFactor=Math.max(0.8,(DB.diffFactor||1)-0.1);
  await saveDB();
  const msg=kind==='easy'?'Top — we maken je volgende workouts wat pittiger \uD83D\uDCAA':kind==='hard'?'Prima — we houden het volgende keer wat rustiger \uD83D\uDE4C':'Mooi, we houden dit niveau aan \u2728';
  const fb=$('#fb');if(fb)fb.innerHTML=`<p style="margin-bottom:16px">${msg}</p><button class="backbtn" data-act="donedismiss">Klaar</button>`;
}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pickN(pool,n){if(!pool.length)return[];const out=[];let bag=[];while(out.length<n){if(!bag.length)bag=shuffle([...pool]);out.push(bag.pop());}return out;}

  } else {
    const gym=B.mloc==='gym';const lib=gym?GYM_LIB:HOME_LIB;
    const rows=lib.map((e,i)=>{const sel=B.sel.includes(i);const meta=gym?`${e.sets} × ${e.reps}${weightOf(e.name)!=null?' · '+fmtKg(weightOf(e.name))+' kg':''} · ${GLABEL[e.group]||e.group}`:`${e.seconds}s · ${e.kind==='cardio'?'cardio':(GLABEL[e.group]||e.group)}`;return `<button class="libitem ${sel?'sel':''}" data-act="badd:${i}"><div style="min-width:0"><div class="ln">${e.name}</div><div class="lg">${meta}</div></div><div class="ladd">${sel?'\u2713':'+'}</div></button>`;}).join('');
    body=`<div class="blabel">Waar train je?</div>${bchips('bmloc',B.mloc,[['thuis','\uD83C\uDFE0 Thuis'],['gym','\uD83C\uDFCB\uFE0F Gym']])}

  }
  $('#builder-body').innerHTML=tabs+body;
  const old=document.querySelector('#builder .sticky-cta');if(old)old.remove();
  if(B.tab==='manual'){const bar=document.createElement('div');bar.className='sticky-cta';bar.innerHTML=`<button class="btn accent" data-act="bstart" ${B.sel.length<2?'style="opacity:.5"':''}>Start${B.sel.length?` (${B.sel.length} gekozen)`:''}</button>`;$('#builder').appendChild(bar);}
}
function genHome(dur,ratio,focus){
  const frac={kracht:0,vooralkracht:0.25,balanced:0.5,vooralcardio:0.75}[ratio];
  const n=Math.max(4,Math.min(16,Math.round((dur*60-90)/52)));
  let nC=Math.round(n*frac),nS=n-nC;
  const strPool=HOME_LIB.filter(e=>e.kind==='strength'&&(focus==='alles'||e.group===focus));
  const carPool=HOME_LIB.filter(e=>e.kind==='cardio');
  const sp=strPool.length?strPool:HOME_LIB.filter(e=>e.kind==='strength');
  nS=Math.min(nS,Math.max(3,sp.length*3));nC=Math.min(nC,carPool.length*3);
  let picks=pickN(sp,nS).concat(pickN(carPool,nC));
  shuffle(picks);
  const steps=[EX('Marcheren op de plaats',50,'Opwarming — kom rustig op gang.')];
  picks.forEach((e,i)=>{steps.push(EX(e.name,e.seconds,e.cue));if(i<picks.length-1)steps.push(RS(15));});
  steps.push(EX('Uitademen & rekken',40,'Cooldown — adem rustig uit.'));
  return {id:'custom',name:'Jouw workout',emoji:'\uD83D\uDEE0\uFE0F',focus:`Thuis · ${dur} min`,type:'time',custom:true,steps};
}
function genGym(dur,ratio,focus){
  let nS=Math.max(3,Math.min(9,Math.round(dur/4)));
  const pool=GYM_LIB.filter(e=>focus==='alles'||e.group===focus);
  const p=pool.length?pool:GYM_LIB;nS=Math.min(nS,Math.max(3,p.length*2));
  const picks=pickN(p,nS);
  const steps=picks.map(e=>GX(e.name,e.sets,e.reps,e.cue));
  const cMin={kracht:0,vooralkracht:0,balanced:10,vooralcardio:15}[ratio];
  if(cMin>0)steps.push({kind:'exercise',cardioNote:true,name:'Cardio-afsluiter',mins:cMin,cue:'Bijv. roeien, loopband, ski-erg of fiets.'});
  return {id:'custom',name:'Jouw workout',emoji:'\uD83D\uDEE0\uFE0F',focus:`Gym · ${dur} min`,type:'reps',custom:true,steps};
}
function generate(){CUSTOM=BUILDER.loc==='gym'?genGym(BUILDER.dur,BUILDER.ratio,BUILDER.focus):genHome(BUILDER.dur,BUILDER.ratio,BUILDER.focus);closeOverlays();openRoutine('custom');}
function buildManual(){
  const gym=BUILDER.mloc==='gym';const lib=gym?GYM_LIB:HOME_LIB;const items=BUILDER.sel.map(i=>lib[i]);if(items.length<2)return;
  let steps;
  if(gym)steps=items.map(e=>GX(e.name,e.sets,e.reps,e.cue));
  else{steps=[EX('Marcheren op de plaats',50,'Opwarming.')];items.forEach((e,i)=>{steps.push(EX(e.name,e.seconds,e.cue));if(i<items.length-1)steps.push(RS(15));});steps.push(EX('Uitademen & rekken',40,'Cooldown.'));}
  CUSTOM={id:'custom',name:'Jouw workout',emoji:'\uD83D\uDEE0\uFE0F',focus:gym?'Gym · eigen keuze':'Thuis · eigen keuze',type:gym?'reps':'time',custom:true,steps};
  closeOverlays();openRoutine('custom');
}

/* ============ BACK-UP (export / import) ============ */
function exportData(){
  try{
    const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download='fitstart-backup-'+todayISO()+'.json';
    document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},1500);
  }catch(e){sheetScrim(`<h3>Exporteren lukt niet</h3><p>Je browser blokkeert de download. Probeer het in Chrome of Safari.</p><div class="sheet-btns"><button class="btn accent" data-act="closesheet">Oké</button></div>`);}
}
function importData(){
  const inp=document.createElement('input');inp.type='file';inp.accept='application/json,.json';
  inp.onchange=()=>{const f=inp.files&&inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{pendingImport=r.result;openImportConfirm();};r.readAsText(f);};
  inp.click();
}
function openImportConfirm(){sheetScrim(`<h3>Gegevens terugzetten</h3><p>Dit vervangt je huidige workouts, gewicht en instellingen door de gekozen back-up. Weet je het zeker?</p><div class="sheet-btns"><button class="btn grey" data-act="closesheet">Annuleer</button><button class="btn mint" data-act="doimport">Terugzetten</button></div>`);}
async function doImport(){
  try{
    const obj=JSON.parse(pendingImport);if(!obj||typeof obj!=='object'||Array.isArray(obj))throw 0;
    DB=Object.assign({history:[],weights:[],goalKg:null,savedMeals:[],diffFactor:1,steps:{},stepGoal:8000,exWeights:{},customMeals:[]},obj);
    await saveDB();closeSheet();TAB='voortgang';render();

}

function genSavory(o,p){
  const prot=wPickOne(WPROT[o.diet]||WPROT.veg);
  let carb=wPickOne(WCARB);if(o.style==='gezond')carb={...carb,q:Math.round(carb.q*0.8)};
  const veg1=wPickOne(WVEG),veg2=wPickOne(WVEG.filter(v=>v!==veg1));
  const oil=o.style==='gezond'?{kc:35,fa:4}:{kc:80,fa:8};
  const n={kcal:Math.round(prot.kc+carb.kc+70+oil.kc),sug:Math.round(prot.su+carb.su+6),fat:Math.round(prot.fa+carb.fa+oil.fa),pro:Math.round(prot.pr+carb.pr+4)};
  const emoji=o.diet==='vis'?'\uD83D\uDC1F':o.diet==='vlees'?'\uD83C\uDF57':'\uD83E\uDD57';
  const ing=[wQ(prot.q*p,prot.u)+' '+prot.n,wQ(carb.q*p,carb.u)+' '+carb.n,`${150*p} g ${veg1}`,`${100*p} g ${veg2}`,'knoflook, ui & olijfolie','peper en verse kruiden'];
  (o.ing||[]).forEach(u=>ing.push('+ '+u+' (jouw keuze)'));
  const steps=[`Kook of bereid de ${carb.n} volgens de verpakking.`,`Bak of gril de ${prot.n} gaar.`,`Roerbak de ${veg1} en ${veg2}${(o.ing&&o.ing.length)?' samen met '+o.ing.join(', '):''} kort mee met knoflook en ui.`,`Breng op smaak met kruiden en peper en serveer alles samen.`];
  return {gen:true,emoji,name:wCap(`${prot.n} met ${veg1} en ${carb.n}`),cat:o.moment,people:p,ing,steps,n};
}
function genDish(o){const p=Math.max(1,(parseInt(o.adults)||1)+Math.round((parseInt(o.kids)||0)*0.6));if(o.moment==='ontbijt')return genSimple(wPickOne(WBREAK[o.diet]||WBREAK.veg),o,p);if(o.moment==='snacks')return genSimple(wPickOne(WSNACK),o,p);return genSavory(o,p);}
function genOptions(o){
  const p=Math.max(1,(parseInt(o.adults)||1)+Math.round((parseInt(o.kids)||0)*0.6));
  if(o.moment==='ontbijt'){let pool=(WBREAK[o.diet]||[]).slice();WBREAK.veg.forEach(r=>{if(pool.length<3&&pool.indexOf(r)<0)pool.push(r);});return pool.slice(0,5).map(r=>genSimple(r,o,p));}
  if(o.moment==='snacks'){return WSNACK.slice(0,5).map(r=>genSimple(r,o,p));}
  const out=[],seen=new Set();let tries=0;
  while(out.length<5&&tries<60){const d=genSavory(o,p);if(!seen.has(d.name)){seen.add(d.name);out.push(d);}tries++;}
  return out;
}
function wGenerate(){if($('#wz-adults')){WIZ_STATE.adults=$('#wz-adults').value;WIZ_STATE.kids=$('#wz-kids').value;WIZ_STATE.ing=($('#wz-ing').value||'').split('\n').map(s=>s.trim()).filter(Boolean);}WIZ_OPTIONS=genOptions(WIZ_STATE);openWizOptions();}
function openWizOptions(){
  const opts=WIZ_OPTIONS;if(!opts||!opts.length)return;const p=opts[0].people;
  closeOverlays();
  const el=document.createElement('div');el.className='overlay';el.id='wizoptions';
  el.innerHTML=`<div class="ohead"><button class="iconbtn" data-act="wclose"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button><strong style="font-family:'Bricolage Grotesque';font-size:17px">Kies een gerecht</strong></div>
  <div class="oscroll"><p style="color:var(--muted);font-size:13px;margin:0 2px 14px">${opts.length} suggesties voor ${p} ${p===1?'persoon':'personen'} · ${CAT_LABEL[WIZ_STATE.moment]}. Tik er een aan voor het recept.</p>
  <div class="rlist">${opts.map((m,i)=>`<button class="meal card" data-act="wpick:${i}"><div class="me">${m.emoji}</div><div style="flex:1;min-width:0"><div class="mn">${m.name}</div><div class="md">${m.n.kcal} kcal · ${m.n.pro} g eiwit · ${m.n.fat} g vet</div></div>${chev()}</button>`).join('')}</div>
  <div style="height:16px"></div><button class="btn ghost" data-act="wagain">\uD83D\uDD01 Andere suggesties</button><div style="height:12px"></div></div>`;
  $('#app').appendChild(el);
}
function wPick(i){WIZ_RESULT=WIZ_OPTIONS[i];if(WIZ_RESULT)openWizResult();}
function openWizResult(){
  const m=WIZ_RESULT;if(!m)return;closeOverlays();const nu=m.n;
  const el=document.createElement('div');el.className='overlay';el.id='wizresult';
  el.innerHTML=`<div class="ohead"><button class="iconbtn" data-act="wback"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button><strong style="font-family:'Bricolage Grotesque';font-size:17px">Jouw gerecht</strong></div>
  <div class="oscroll"><div style="text-align:center;padding:10px 0 4px"><div style="font-size:60px">${m.emoji}</div><h2 style="font-family:'Bricolage Grotesque';font-weight:800;font-size:23px;margin:8px 12px 2px">${m.name}</h2><div style="color:var(--muted);font-size:13px">Voor ${m.people} ${m.people===1?'persoon':'personen'} · ${CAT_LABEL[m.cat]}</div></div>
  <div class="card" style="padding:16px 14px;margin-top:14px"><div class="nutr"><div class="nu"><div class="nv" style="color:var(--accent)">${nu.kcal}</div><div class="nl">kcal</div></div><div class="nu"><div class="nv">${nu.sug} g</div><div class="nl">suikers</div></div><div class="nu"><div class="nv">${nu.fat} g</div><div class="nl">vetten</div></div><div class="nu"><div class="nv">${nu.pro} g</div><div class="nl">eiwitten</div></div></div><div style="text-align:center;font-size:11px;color:var(--muted);margin-top:10px">Schatting per portie</div></div>
  <div class="card" style="padding:18px;margin-top:14px"><h2 class="sec" style="margin:0 0 12px">Ingrediënten (totaal)</h2>${m.ing.map(i=>`<div style="display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)"><span style="width:7px;height:7px;border-radius:50%;background:var(--mint);flex-shrink:0"></span><span style="font-size:14px">${i}</span></div>`).join('')}</div>
  <div class="card" style="padding:18px;margin-top:14px"><h2 class="sec" style="margin:0 0 12px">Bereiding</h2>${m.steps.map((s,i)=>`<div style="display:flex;gap:12px;padding:8px 0"><span style="font-family:'Space Grotesk';font-weight:700;color:var(--mint);flex-shrink:0">${i+1}</span><span style="font-size:14px;line-height:1.5">${s}</span></div>`).join('')}</div>
  <div style="height:16px"></div><button class="btn ghost" data-act="wback">\u2039 Terug naar de opties</button><div style="height:12px"></div></div>
  <div class="sticky-cta"><button class="btn mint" data-act="wsave">\u2665 Bewaar dit gerecht</button></div>`;
  $('#app').appendChild(el);
}
async function wSave(){const m=WIZ_RESULT;if(!m)return;const id='cust'+Date.now();DB.customMeals.push({id,cat:m.cat,name:m.name,emoji:m.emoji,prep:`${m.people} pers.`,ing:m.ing,steps:m.steps,n:m.n});if(!DB.savedMeals.includes(id))DB.savedMeals.push(id);await saveDB();closeOverlays();MCAT=m.cat;renderEten();}

/* ============ EVENTS ============ */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const parts=t.dataset.act.split(':');const cmd=parts[0],arg=parts[1],arg2=parts[2];
  switch(cmd){
    case 'tab':closeOverlays();P=null;CL=null;TAB=arg;render();break;
    case 'loc':LOC=arg;renderTrainen();break;
    case 'htab':HTAB=arg;renderTrainen();break;
    case 'equip':EQUIP=arg;renderTrainen();break;
    case 'group':GROUP=arg;renderTrainen();break;
    case 'open':openRoutine(arg);break;
    case 'closeov':P=null;CL=null;closeOverlays();break;
    case 'start':startWorkout(arg);break;
    case 'checklist':openChecklist(arg);break;
    case 'cltoggle':toggleCL(+arg);break;
    case 'clw':clWeight(+arg);break;
    case 'clfeel':clFeel(+arg,arg2);break;
    case 'saveexw':saveExW();break;
    case 'finishcl':finishChecklist();break;
    case 'pause':pauseToggle();break;
    case 'skip':advance();break;
    case 'quit':quitWorkout();break;
    case 'fb':feedback(arg);break;
    case 'donedismiss':closeOverlays();TAB='voortgang';render();break;
    case 'mcat':MCAT=arg;renderEten();break;
    case 'meal':openMeal(arg);break;
    case 'save':toggleSave(arg);break;
    case 'exinfo':openExInfo(t.dataset.ex);break;
    case 'dw':openWeightByName(t.dataset.ex);break;
    case 'addmeal':openAddMeal();break;
    case 'amcat':AM_CAT=arg;document.querySelectorAll('#am-cats .bchip').forEach(b=>b.classList.toggle('on',b.dataset.act==='amcat:'+arg));break;
    case 'saveaddmeal':saveAddMeal();break;
    case 'delmeal':delMeal(arg);break;
    case 'export':exportData();break;
    case 'import':importData();break;
    case 'doimport':doImport();break;
    case 'addact':openAddActivity();break;
    case 'aacat':AA_CAT=arg;document.querySelectorAll('#aa-cats .bchip').forEach(b=>b.classList.toggle('on',b.dataset.act==='aacat:'+arg));break;
    case 'saveact':saveActivity();break;
    case 'wizard':openWizard();break;
    case 'wmoment':WIZ_STATE.moment=arg;document.querySelectorAll('#wz-moment .bchip').forEach(b=>b.classList.toggle('on',b.dataset.act==='wmoment:'+arg));break;
    case 'wdiet':WIZ_STATE.diet=arg;document.querySelectorAll('#wz-diet .bchip').forEach(b=>b.classList.toggle('on',b.dataset.act==='wdiet:'+arg));break;
    case 'wstyle':WIZ_STATE.style=arg;document.querySelectorAll('#wz-style .bchip').forEach(b=>b.classList.toggle('on',b.dataset.act==='wstyle:'+arg));break;
    case 'wgen':wGenerate();break;
    case 'wagain':wGenerate();break;
    case 'wpick':wPick(+arg);break;
    case 'wback':openWizOptions();break;
    case 'wsave':wSave();break;
    case 'wclose':closeOverlays();renderEten();break;
    case 'sheet':openSheet(arg);break;
    case 'steps':arg==='log'?openStepsSheet():openStepGoalSheet();break;
    case 'clog':openCardioSheet(arg);break;
    case 'closesheet':closeSheet();break;
    case 'savew':saveWeight();break;
    case 'saveg':saveGoal();break;
    case 'clearg':clearGoal();break;
    case 'savesteps':saveSteps();break;
    case 'savestepgoal':saveStepGoal();break;
    case 'saveclog':saveCardio();break;
    case 'scrim':closeSheet();break;
    case 'openbuilder':openBuilder();break;
    case 'btab':BUILDER.tab=arg;drawBuilder();break;
    case 'bloc':BUILDER.loc=arg;drawBuilder();break;
    case 'bdur':BUILDER.dur=+arg;drawBuilder();break;
    case 'bratio':BUILDER.ratio=arg;drawBuilder();break;
    case 'bfocus':BUILDER.focus=arg;drawBuilder();break;
    case 'bmloc':BUILDER.mloc=arg;BUILDER.sel=[];drawBuilder();break;
    case 'badd':builderAdd(+arg);break;
    case 'bgen':generate();break;
    case 'bstart':buildManual();break;
  }
});
document.addEventListener('click',e=>{if(e.target.closest('.sheet')&&!e.target.closest('[data-act]'))e.stopPropagation();},true);

/* ============ INIT ============ */
(async function(){await loadDB();render();
  const sc=document.getElementById('scroll'),nav=document.getElementById('nav');
  let lastY=0;
  sc.addEventListener('scroll',()=>{const y=sc.scrollTop;if(y>lastY+6&&y>70)nav.classList.add('hidden');else if(y<lastY-6||y<40)nav.classList.remove('hidden');lastY=y;},{passive:true});
})();
</script>
