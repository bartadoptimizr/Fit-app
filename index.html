<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>FitStart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14202B; --muted:#6C7885; --line:#E6EAEF; --card:#FFFFFF;
    --accent:#FF5630; --accent-soft:#FFEDE7;
    --mint:#0FB981; --mint-soft:#E3F7EF;
    --blue:#2B6DE0; --blue-soft:#E7EFFC;
    --purple:#7A5AF0; --purple-soft:#EDE9FD;
    --shadow:0 6px 24px rgba(20,32,43,.08); --shadow-lg:0 18px 50px rgba(20,32,43,.18);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:'Inter',system-ui,sans-serif;color:var(--ink);background:#DDE2E8;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
  #app{max-width:460px;margin:0 auto;min-height:100vh;min-height:100dvh;background:linear-gradient(180deg,#F7F8FA 0%,#EEF1F5 100%);position:relative;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);overflow:hidden}
  .scroll{flex:1;overflow-y:auto;padding:22px 20px 108px;-webkit-overflow-scrolling:touch}
  .head{padding:6px 2px 18px}
  .kicker{font-family:'Space Grotesk';font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
  .head h1{font-family:'Bricolage Grotesque';font-weight:800;font-size:30px;line-height:1.05;margin:6px 0 0;letter-spacing:-.02em}
  .head p{margin:6px 0 0;color:var(--muted);font-size:14px}
  h2.sec{font-family:'Bricolage Grotesque';font-weight:700;font-size:15px;margin:24px 2px 12px;display:flex;align-items:center;justify-content:space-between}
  .card{background:var(--card);border-radius:20px;box-shadow:var(--shadow)}

  /* segmented toggle */
  .toggle{display:flex;background:#E7EBF0;border-radius:14px;padding:4px;margin:2px 0 4px}
  .toggle button{flex:1;padding:10px;border-radius:11px;font-weight:600;font-size:14px;color:var(--muted)}
  .toggle button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(20,32,43,.1)}

  .today{padding:22px;border-radius:24px;color:#fff;position:relative;overflow:hidden;background:radial-gradient(120% 140% at 90% 0%, #FF7A4D 0%, #FF5630 55%, #E23E1E 100%);box-shadow:0 14px 34px rgba(255,86,48,.34)}
  .today.gym{background:radial-gradient(120% 140% at 90% 0%, #9B84F5 0%, #7A5AF0 55%, #5B3FD4 100%);box-shadow:0 14px 34px rgba(122,90,240,.34)}
  .today .tag{display:inline-block;font-family:'Space Grotesk';font-weight:600;font-size:11px;letter-spacing:.12em;text-transform:uppercase;background:rgba(255,255,255,.22);padding:5px 10px;border-radius:100px}
  .today h3{font-family:'Bricolage Grotesque';font-weight:800;font-size:24px;margin:14px 0 6px}
  .today .meta{font-size:13px;opacity:.92;font-weight:500}
  .today .go{margin-top:18px;background:#fff;color:var(--accent);font-weight:700;font-size:15px;padding:13px 18px;border-radius:14px;display:flex;align-items:center;gap:8px;width:100%;justify-content:center}
  .today.gym .go{color:var(--purple)}
  .today .blob{position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.12)}

  .rlist{display:flex;flex-direction:column;gap:12px}
  .routine{display:flex;align-items:center;gap:14px;padding:14px;text-align:left;width:100%;border-radius:18px}
  .routine .ic{width:52px;height:52px;border-radius:15px;flex-shrink:0;display:grid;place-items:center;font-size:24px}
  .routine .body{flex:1;min-width:0}
  .routine .body .n{font-weight:700;font-size:16px}
  .routine .body .m{color:var(--muted);font-size:13px;margin-top:2px}
  .chev{color:var(--muted);flex-shrink:0}

  .statrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  .stat{padding:16px 14px;border-radius:18px;text-align:center}
  .stat .v{font-family:'Space Grotesk';font-weight:700;font-size:26px;line-height:1}
  .stat .l{font-size:12px;color:var(--muted);margin-top:6px;font-weight:500}
  .stat.flame .v{color:var(--accent)} .stat.mint .v{color:var(--mint)}
  .weekstrip{display:flex;justify-content:space-between;gap:6px;padding:18px 16px}
  .day{flex:1;text-align:center}
  .day .dot{width:30px;height:30px;border-radius:50%;margin:0 auto 7px;display:grid;place-items:center;background:#EEF1F5;color:var(--muted);font-size:13px;font-weight:600}
  .day.done .dot{background:var(--mint);color:#fff}
  .day.today .dot{box-shadow:0 0 0 3px var(--mint-soft)}
  .day .dl{font-size:11px;color:var(--muted);font-weight:600}
  .barchart{display:flex;align-items:flex-end;gap:8px;height:110px;padding:16px 16px 0}
  .bar-wrap{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
  .bar{width:100%;max-width:26px;background:var(--mint);border-radius:7px 7px 4px 4px;min-height:4px}
  .bar.empty{background:#EAEEF2}
  .bar-l{font-size:11px;color:var(--muted);font-weight:600}
  .history{display:flex;flex-direction:column}
  .hitem{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line)}
  .hitem:last-child{border-bottom:none}
  .hitem .hic{width:38px;height:38px;border-radius:11px;background:var(--accent-soft);display:grid;place-items:center;font-size:18px}
  .hitem .hn{font-weight:600;font-size:14px}
  .hitem .hd{font-size:12px;color:var(--muted)}
  .hitem .hm{margin-left:auto;font-size:13px;font-weight:600;color:var(--muted)}

  .wtop{display:flex;align-items:flex-end;gap:14px;padding:20px 18px 6px}
  .wtop .big{font-family:'Space Grotesk';font-weight:700;font-size:40px;line-height:.9;color:var(--blue)}
  .wtop .unit{font-size:16px;color:var(--muted);font-weight:600;margin-left:4px}
  .wtop .delta{font-size:13px;font-weight:600;padding:4px 9px;border-radius:100px;margin-bottom:6px}
  .delta.down{background:var(--mint-soft);color:var(--mint)} .delta.up{background:#FDEBE8;color:var(--accent)} .delta.flat{background:#EEF1F5;color:var(--muted)}
  .wchart{padding:8px 8px 4px} .wempty{padding:26px 20px;text-align:center;color:var(--muted);font-size:14px;line-height:1.5}
  .goalbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-top:1px solid var(--line)}
  .goalbar .gt{font-size:13px;color:var(--muted)} .goalbar .gt b{color:var(--ink);font-weight:700}
  .linkbtn{color:var(--blue);font-weight:600;font-size:13px}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:15px;padding:14px 18px;border-radius:14px;width:100%}
  .btn.blue{background:var(--blue);color:#fff} .btn.accent{background:var(--accent);color:#fff}
  .btn.purple{background:var(--purple);color:#fff} .btn.ghost{background:#fff;color:var(--ink);box-shadow:var(--shadow)} .btn.grey{background:#EEF1F5;color:var(--ink)}

  /* meals */
  .segwrap{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px;scrollbar-width:none}
  .segwrap::-webkit-scrollbar{display:none}
  .seg{flex-shrink:0;padding:9px 15px;border-radius:100px;background:#fff;color:var(--muted);font-weight:600;font-size:14px;box-shadow:var(--shadow)}
  .seg.on{background:var(--mint);color:#fff;box-shadow:0 8px 20px rgba(15,185,129,.3)}
  .meal{padding:14px;border-radius:18px;text-align:left;width:100%;display:flex;align-items:center;gap:14px}
  .meal .me{width:48px;height:48px;border-radius:14px;background:var(--mint-soft);display:grid;place-items:center;font-size:24px;flex-shrink:0}
  .meal .mn{font-weight:700;font-size:15px} .meal .md{font-size:12px;color:var(--muted);margin-top:3px}
  .heart{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex-shrink:0;background:#F4F6F8}
  .heart svg{width:20px;height:20px}
  .heart.on{background:var(--accent-soft)}
  .daymenu{padding:6px 16px}
  .daymenu .dm-row{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);text-align:left;width:100%}
  .daymenu .dm-row:last-child{border-bottom:none}
  .daymenu .dm-e{font-size:26px;width:40px;text-align:center;flex-shrink:0}
  .daymenu .dm-cat{font-size:11px;font-weight:700;color:var(--mint);letter-spacing:.06em;text-transform:uppercase}
  .daymenu .dm-n{font-weight:600;font-size:14px;margin-top:2px}

  .nav{position:absolute;left:0;right:0;bottom:0;display:flex;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom))}
  .nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 2px;color:var(--muted);font-size:11px;font-weight:600;border-radius:12px}
  .nav button.on{color:var(--accent)} .nav button svg{width:24px;height:24px}

  .overlay{position:absolute;inset:0;background:linear-gradient(180deg,#F7F8FA 0%,#EEF1F5 100%);z-index:40;display:flex;flex-direction:column;animation:slideup .28s cubic-bezier(.2,.8,.2,1)}
  @keyframes slideup{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .ohead{display:flex;align-items:center;gap:12px;padding:18px 18px 8px}
  .iconbtn{width:40px;height:40px;border-radius:12px;background:#fff;box-shadow:var(--shadow);display:grid;place-items:center}
  .oscroll{flex:1;overflow-y:auto;padding:8px 20px 28px}
  .detail-hero{padding:22px;border-radius:22px;color:#fff;background:radial-gradient(120% 140% at 90% 0%, #FF7A4D 0%, #FF5630 60%, #E23E1E 100%);box-shadow:0 14px 34px rgba(255,86,48,.3)}
  .detail-hero.gym{background:radial-gradient(120% 140% at 90% 0%, #9B84F5 0%, #7A5AF0 60%, #5B3FD4 100%);box-shadow:0 14px 34px rgba(122,90,240,.3)}
  .detail-hero h2{font-family:'Bricolage Grotesque';font-weight:800;font-size:26px;margin:10px 0 6px}
  .detail-hero .meta{font-size:14px;opacity:.92;font-weight:500}
  .steplist{margin-top:2px}
  .step-r{display:flex;align-items:center;gap:14px;padding:12px 4px;border-bottom:1px solid var(--line)}
  .step-r:last-child{border-bottom:none}
  .step-r .si{font-family:'Space Grotesk';font-weight:700;color:var(--muted);width:22px;font-size:14px}
  .step-r .sn{font-weight:600;font-size:15px} .step-r .sc{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.35}
  .step-r .st{margin-left:auto;font-family:'Space Grotesk';font-weight:600;font-size:13px;color:var(--accent);flex-shrink:0}
  .step-r.rest .st{color:var(--mint)}
  .newbadge{display:inline-block;font-size:10px;font-weight:700;color:#fff;background:var(--mint);padding:2px 7px;border-radius:100px;margin-left:8px;vertical-align:middle;letter-spacing:.04em}
  .sticky-cta{padding:12px 20px calc(18px + env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent,#EEF1F5 30%);display:flex;flex-direction:column;gap:10px}

  /* checklist */
  .clbar{height:8px;background:#E7EBF0;border-radius:100px;overflow:hidden;margin:2px 4px 14px}
  .clbar > div{height:100%;background:var(--mint);border-radius:100px;transition:width .3s ease;width:0}
  .clrow{display:flex;align-items:center;gap:14px;padding:14px;border-radius:16px;text-align:left;width:100%;margin-bottom:10px;background:#fff;box-shadow:var(--shadow)}
  .clrow .box{width:30px;height:30px;border-radius:9px;border:2px solid var(--line);flex-shrink:0;display:grid;place-items:center;color:transparent;transition:.15s}
  .clrow.on .box{background:var(--mint);border-color:var(--mint);color:#fff}
  .clrow.on .cn{color:var(--muted);text-decoration:line-through}
  .clrow .cn{font-weight:600;font-size:15px} .clrow .cc{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.35}
  .clrow .cq{margin-left:auto;font-family:'Space Grotesk';font-weight:700;font-size:14px;color:var(--purple);flex-shrink:0}

  .player{position:absolute;inset:0;z-index:50;background:var(--ink);color:#fff;display:flex;flex-direction:column;animation:fade .2s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .player.rest{background:#0C2A22}
  .ptop{display:flex;align-items:center;justify-content:space-between;padding:20px 22px 6px}
  .ptop .prog{font-family:'Space Grotesk';font-weight:600;font-size:14px;letter-spacing:.04em;color:rgba(255,255,255,.7)}
  .ptop .quit{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.12);display:grid;place-items:center;color:#fff}
  .ring-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:0 24px}
  .ring{position:relative;width:262px;height:262px}
  .ring svg{transform:rotate(-90deg)}
  .ring .rbg{fill:none;stroke:rgba(255,255,255,.12);stroke-width:14}
  .ring .rfg{fill:none;stroke:var(--accent);stroke-width:14;stroke-linecap:round;transition:stroke-dashoffset 1s linear}
  .player.rest .ring .rfg{stroke:var(--mint)}
  .ring .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring .center .num{font-family:'Space Grotesk';font-weight:700;font-size:64px;line-height:1;font-variant-numeric:tabular-nums}
  .ring .center .ph{font-family:'Space Grotesk';font-weight:600;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.6);margin-top:8px}
  .exinfo{text-align:center;min-height:96px}
  .exinfo .exn{font-family:'Bricolage Grotesque';font-weight:800;font-size:28px}
  .exinfo .exc{font-size:14px;color:rgba(255,255,255,.72);margin-top:8px;line-height:1.45;max-width:320px}
  .nextup{text-align:center;font-size:13px;color:rgba(255,255,255,.5);font-weight:500}
  .nextup b{color:rgba(255,255,255,.8);font-weight:600}
  .pctrl{display:flex;gap:14px;padding:18px 24px calc(26px + env(safe-area-inset-bottom))}
  .pctrl button{flex:1;padding:16px;border-radius:16px;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px}
  .pctrl .pause{background:rgba(255,255,255,.14);color:#fff} .pctrl .skip{background:#fff;color:var(--ink)}

  .done{position:absolute;inset:0;z-index:55;background:linear-gradient(180deg,#0FB981,#0A8F63);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:36px;animation:fade .3s ease;overflow-y:auto}
  .done .check{width:88px;height:88px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;margin-bottom:20px;animation:pop .4s cubic-bezier(.2,1.3,.4,1) both}
  @keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
  .done h2{font-family:'Bricolage Grotesque';font-weight:800;font-size:30px;margin:0 0 8px}
  .done p{font-size:15px;opacity:.9;margin:0 0 6px;max-width:290px;line-height:1.5}
  .done .stats{display:flex;gap:24px;margin:18px 0 22px}
  .done .stats .s .v{font-family:'Space Grotesk';font-weight:700;font-size:28px}
  .done .stats .s .l{font-size:12px;opacity:.85;margin-top:2px}
  .fbwrap{width:100%;max-width:320px}
  .fblabel{font-size:13px;opacity:.9;margin-bottom:10px;font-weight:600}
  .fbrow{display:flex;gap:10px}
  .fbrow button{flex:1;padding:12px 6px;border-radius:13px;background:rgba(255,255,255,.16);color:#fff;font-weight:600;font-size:13px;border:1.5px solid rgba(255,255,255,.25)}
  .done .backbtn{background:#fff;color:#0A8F63;font-weight:700;font-size:16px;padding:15px 40px;border-radius:16px;margin-top:8px}

  .sheet-scrim{position:absolute;inset:0;background:rgba(20,32,43,.45);z-index:60;display:flex;align-items:flex-end;animation:fade .2s ease}
  .sheet{background:#fff;width:100%;border-radius:24px 24px 0 0;padding:22px 22px calc(24px + env(safe-area-inset-bottom));animation:slideup .28s cubic-bezier(.2,.8,.2,1)}
  .sheet h3{font-family:'Bricolage Grotesque';font-weight:800;font-size:20px;margin:0 0 4px}
  .sheet p{color:var(--muted);font-size:13px;margin:0 0 18px}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:7px}
  .field input{width:100%;font-family:'Space Grotesk';font-weight:600;font-size:18px;padding:14px 16px;border:1.5px solid var(--line);border-radius:14px;background:#F7F8FA;color:var(--ink)}
  .field input:focus{border-color:var(--blue);background:#fff;outline:none}
  .sheet-btns{display:flex;gap:10px;margin-top:6px} .sheet-btns .btn{flex:1}
  .empty-note{color:var(--muted);font-size:14px;text-align:center;padding:20px;line-height:1.5}
  @media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<div id="app"><div class="scroll" id="scroll"></div><nav class="nav" id="nav"></nav></div>
<script>
/* ============ DATA ============ */
const EX=(name,seconds,cue)=>({kind:'exercise',name,seconds,cue});
const RS=s=>({kind:'rest',name:'Rust',seconds:s,cue:'Even ademhalen'});
const GX=(name,sets,reps,cue)=>({kind:'exercise',reps:true,name,sets,reps,cue});

const HOME=[
  {id:'fullbody',name:'Full body start',emoji:'\uD83D\uDD25',focus:'Hele lichaam',type:'time',steps:[
    EX('Marcheren op de plaats',60,'Opwarming — til je knieën op en zwaai je armen mee.'),
    EX('Armcirkels',30,'Grote rustige cirkels, halverwege de andere kant op.'),RS(15),
    EX('Squats',40,'Voeten op heupbreedte, zak alsof je gaat zitten, rug recht.'),RS(20),
    EX('Knieheffen',40,'Til om beurten je knie richting je borst, blijf in beweging.'),RS(20),
    EX('Knie-push-ups',40,'Handen onder je schouders, zak gecontroleerd, knieën op de grond.'),RS(20),
    EX('Glute bridge',40,'Op je rug, voeten plat, duw je heupen omhoog en knijp je billen.'),RS(20),
    EX('Bird dog',40,'Op handen en knieën, strek om beurten arm en tegenoverliggend been.'),RS(20),
    EX('Plank',30,'Op onderarmen of knieën, lijf recht, buik aanspannen.'),
    EX('Rustig uitrekken',40,'Cooldown — adem rustig en rek zachtjes uit.')]},
  {id:'core',name:'Core & buik',emoji:'\uD83C\uDFAF',focus:'Buik & romp',type:'time',steps:[
    EX('Marcheren op de plaats',45,'Opwarming, kom rustig op temperatuur.'),RS(15),
    EX('Crunch',40,'Onderrug op de grond, kin los van je borst, rustig omhoog.'),RS(20),
    EX('Dead bug',40,'Op je rug, strek om beurten arm en tegenoverliggend been.'),RS(20),
    EX('Plank',30,'Lijf recht, buik strak (op je knieën mag ook).'),RS(20),
    EX('Zijplank links',25,'Op je onderarm, heup omhoog (knie mag op de grond).'),RS(15),
    EX('Zijplank rechts',25,'Andere kant — heup omhoog, blijf strak.'),RS(20),
    EX('Glute bridge',40,'Heupen omhoog, knijp je billen, rustig zakken.'),
    EX('Onderrug rekken',40,'Cooldown — knieën naar je borst, rustig ademen.')]},
  {id:'legs',name:'Benen & billen',emoji:'\uD83E\uDDB5',focus:'Onderlichaam',type:'time',steps:[
    EX('Marcheren op de plaats',45,'Opwarming voor je benen.'),RS(15),
    EX('Squats',40,'Zak diep maar comfortabel, gewicht op je hielen.'),RS(20),
    EX('Uitvalspas (lunges)',40,'Grote stap naar voren, zak recht omlaag, wissel af.'),RS(20),
    EX('Glute bridge',40,'Duw je heupen omhoog en knijp je billen aan.'),RS(20),
    EX('Kuitverhogingen',40,'Kom op je tenen en zak rustig terug.'),RS(20),
    EX('Wall sit',30,'Zit tegen de muur met 90° knieën, rug plat.'),RS(20),
    EX('Squats',40,'Laatste set — houd je tempo rustig en netjes.'),
    EX('Benen uitrekken',40,'Cooldown — rek je bovenbenen en kuiten uit.')]},
  {id:'boost',name:'Energie boost',emoji:'\u26A1',focus:'Snel & actief',type:'time',steps:[
    EX('Marcheren op de plaats',40,'Kom lekker op gang.'),
    EX('Jumping jacks',30,'Rustig tempo — of stap opzij zonder springen.'),RS(15),

/* ============ STORAGE (Claude storage OR localStorage fallback for Chrome) ============ */
const SKEY='fitstart:data';
const hasClaude=typeof window!=='undefined'&&window.storage&&typeof window.storage.get==='function';
function lsOK(){try{localStorage.setItem('__t','1');localStorage.removeItem('__t');return true;}catch(e){return false;}}
const MODE=hasClaude?'claude':(lsOK()?'local':'memory');
let DB={history:[],weights:[],goalKg:null,savedMeals:[],diffFactor:1};
async function loadDB(){
  try{
    if(MODE==='claude'){const r=await window.storage.get(SKEY);if(r&&r.value)Object.assign(DB,JSON.parse(r.value));}
    else if(MODE==='local'){const v=localStorage.getItem(SKEY);if(v)Object.assign(DB,JSON.parse(v));}
  }catch(e){}
}
async function saveDB(){
  try{
    if(MODE==='claude')await window.storage.set(SKEY,JSON.stringify(DB));
    else if(MODE==='local')localStorage.setItem(SKEY,JSON.stringify(DB));
  }catch(e){}
}

const pad=n=>String(n).padStart(2,'0');
const fmtTime=s=>`${Math.floor(s/60)}:${pad(s%60)}`;
const todayISO=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;};
const DAYNL=['Zo','Ma','Di','Wo','Do','Vr','Za'];

function isoWeek(d=new Date()){const t=new Date(d);t.setHours(0,0,0,0);t.setDate(t.getDate()+3-((t.getDay()+6)%7));const w1=new Date(t.getFullYear(),0,4);return 1+Math.round(((t-w1)/86400000-3+((w1.getDay()+6)%7))/7);}
function dayOfYear(d=new Date()){return Math.floor((d-new Date(d.getFullYear(),0,0))/86400000);}
function greeting(){const h=new Date().getHours();return h<6?'Goedenacht':h<12?'Goedemorgen':h<18?'Goedemiddag':'Goedenavond';}

/* difficulty applied + weekly bonus */
function stepsFor(r){
  const f=DB.diffFactor||1;
  let out=r.steps.map(s=>{
    if(s.kind==='rest')return {...s};
    if(s.reps){const delta=Math.round((f-1)*10);return {...s,reps:Math.max(6,Math.min(20,s.reps+delta))};}
    return {...s,seconds:Math.max(10,Math.round(s.seconds*f))};
  });
  if(r.type==='time'){
    const b={...BONUS[(isoWeek()+HOME.findIndex(x=>x.id===r.id))%BONUS.length],isNew:true};
    b.seconds=Math.max(10,Math.round(b.seconds*f));
    out.splice(out.length-1,0,RS(15),b); // insert before cooldown
  }
  return out;
}
function totalMin(r){return Math.round(stepsFor(r).reduce((a,s)=>a+(s.seconds||0),0)/60);}
function exCount(r){return stepsFor(r).filter(s=>s.kind==='exercise').length;}
function computeStreak(){
  const set=new Set(DB.history.map(h=>h.date));if(!set.size)return 0;
  let streak=0,cur=new Date();const key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  if(!set.has(key(cur))){cur.setDate(cur.getDate()-1);if(!set.has(key(cur)))return 0;}
  while(set.has(key(cur))){streak++;cur.setDate(cur.getDate()-1);}return streak;
}
function weekDates(){const now=new Date();const day=(now.getDay()+6)%7;const mon=new Date(now);mon.setDate(now.getDate()-day);return Array.from({length:7},(_,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return d;});}

function beep(freq=660,dur=0.12){try{if(!sound)sound=new (window.AudioContext||window.webkitAudioContext)();const o=sound.createOscillator(),g=sound.createGain();o.frequency.value=freq;o.type='sine';o.connect(g);g.connect(sound.destination);g.gain.setValueAtTime(0.14,sound.currentTime);g.gain.exponentialRampToValueAtTime(0.0001,sound.currentTime+dur);o.start();o.stop(sound.currentTime+dur);}catch(e){}}

  const cur=w.length?w[w.length-1].kg:null,first=w.length?w[0].kg:null;
  let deltaHTML='';
  if(w.length>1){const diff=+(cur-first).toFixed(1);const cls=diff<0?'down':diff>0?'up':'flat';const txt=diff<0?`${Math.abs(diff)} kg omlaag`:diff>0?`${diff} kg omhoog`:'gelijk gebleven';deltaHTML=`<span class="delta ${cls}">${txt}</span>`;}
  let goalHTML;
  if(DB.goalKg&&cur!=null){const rem=+(cur-DB.goalKg).toFixed(1);goalHTML=rem>0?`<div class="goalbar"><div class="gt">Nog <b>${rem} kg</b> tot je doel van ${DB.goalKg} kg</div><button class="linkbtn" data-act="sheet:goal">Wijzig</button></div>`:`<div class="goalbar"><div class="gt">\uD83C\uDF89 Je bent op of onder je doel van <b>${DB.goalKg} kg</b>!</div><button class="linkbtn" data-act="sheet:goal">Wijzig</button></div>`;}
  else goalHTML=`<div class="goalbar"><div class="gt">Stel een vrijblijvend streefgewicht in</div><button class="linkbtn" data-act="sheet:goal">Instellen</button></div>`;
  scrollEl().innerHTML=`
    <div class="head"><div class="kicker" style="color:var(--blue)">Gewicht</div><h1>Volg je trend</h1><p>Kijk naar de lijn over weken, niet naar één dag. Gewicht wisselt van nature.</p></div>
    <div class="card">
      ${cur!=null?`<div class="wtop"><div><span class="big">${cur}</span><span class="unit">kg</span></div>${deltaHTML}</div><div class="wchart">${weightChart(w)}</div>`:`<div class="wempty">Nog geen metingen.<br>Log je gewicht om je trend te zien.</div>`}
      ${goalHTML}
    </div>
    <div style="height:16px"></div>
    <button class="btn blue" data-act="sheet:weight">+ Gewicht loggen</button>
    <p style="text-align:center;color:var(--muted);font-size:12px;margin-top:16px;line-height:1.5">Tip: weeg jezelf het liefst op een vast moment. Gezond afvallen gaat geleidelijk — wees mild voor jezelf.</p>`;
}
function weightChart(w){
  if(w.length<2)return `<div class="wempty" style="padding:16px">Log minstens twee metingen voor een grafiek.</div>`;
  const W=380,H=150,p=14;const kgs=w.map(x=>x.kg).concat(DB.goalKg?[DB.goalKg]:[]);let min=Math.min(...kgs),max=Math.max(...kgs);if(max-min<2){const c=(max+min)/2;min=c-1.5;max=c+1.5;}const rng=max-min;
  const x=i=>p+(i/(w.length-1))*(W-2*p),y=v=>p+(1-(v-min)/rng)*(H-2*p);
  const pts=w.map((q,i)=>`${x(i).toFixed(1)},${y(q.kg).toFixed(1)}`).join(' ');
  const area=`${p},${H-p} ${pts} ${W-p},${H-p}`;
  const gl=DB.goalKg?`<line x1="${p}" y1="${y(DB.goalKg).toFixed(1)}" x2="${W-p}" y2="${y(DB.goalKg).toFixed(1)}" stroke="var(--mint)" stroke-width="1.5" stroke-dasharray="5 5"/><text x="${W-p}" y="${(y(DB.goalKg)-6).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--mint)" font-family="Space Grotesk" font-weight="600">doel ${DB.goalKg}</text>`:'';
  const dots=w.map((q,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(q.kg).toFixed(1)}" r="3.5" fill="#fff" stroke="var(--blue)" stroke-width="2"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block"><defs><linearGradient id="wg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--blue)" stop-opacity="0.18"/><stop offset="1" stop-color="var(--blue)" stop-opacity="0"/></linearGradient></defs><polygon points="${area}" fill="url(#wg)"/>${gl}<polyline points="${pts}" fill="none" stroke="var(--blue)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>${dots}</svg>`;
}

function renderEten(){
  const saved=new Set(DB.savedMeals);
  let body='';
  if(MCAT==='vandaag'){
    const seed=dayOfYear();
    const pick=(arr,off)=>arr[(seed+off)%arr.length];
    const menu=[['ontbijt',pick(MEALS.ontbijt,0)],['lunch',pick(MEALS.lunch,1)],['diner',pick(MEALS.diner,2)],['snacks',pick(MEALS.snacks,3)]];
    body=`<div class="card daymenu">${menu.map(([c,m])=>`<button class="dm-row" data-act="meal:${m.id}"><div class="dm-e">${m.emoji}</div><div style="flex:1;min-width:0"><div class="dm-cat">${CAT_LABEL[c]}</div><div class="dm-n">${m.name}</div></div>${chev()}</button>`).join('')}</div>
    <p style="text-align:center;color:var(--muted);font-size:12px;margin-top:14px">Het menu wisselt elke dag automatisch \uD83D\uDD01</p>`;
  } else if(MCAT==='bewaard'){
    const items=DB.savedMeals.map(findMeal).filter(Boolean);
    body=items.length?`<div class="rlist">${items.map(m=>mealCard(m,true)).join('')}</div>`:`<div class="empty-note">Nog niets bewaard. Tik op het \u2665 bij een gerecht om het hier te verzamelen.</div>`;
  } else {
    body=`<div class="rlist">${MEALS[MCAT].map(m=>mealCard({...m,cat:MCAT},saved.has(m.id))).join('')}</div>`;
  }
  scrollEl().innerHTML=`
    <div class="head"><div class="kicker" style="color:var(--mint)">Gezond eten</div><h1>Lekker &amp; simpel</h1><p>Gebalanceerde ideeën voor elke dag. Geen calorieën tellen, wel goed eten.</p></div>
    <div class="segwrap">${MEAL_CATS.map(([k,l])=>`<button class="seg ${MCAT===k?'on':''}" data-act="mcat:${k}">${l}${k==='bewaard'&&DB.savedMeals.length?` (${DB.savedMeals.length})`:''}</button>`).join('')}</div>
    <div style="margin-top:6px">${body}</div>`;
}
function mealCard(m,saved){
  return `<div class="meal card">
    <button class="me" data-act="meal:${m.id}" style="border:none">${m.emoji}</button>
    <button data-act="meal:${m.id}" style="flex:1;text-align:left;min-width:0"><div class="mn">${m.name}</div><div class="md">${m.prep} · ${m.ing.length} ingrediënten</div></button>
    <button class="heart ${saved?'on':''}" data-act="save:${m.id}" aria-label="Bewaren">${heartSVG(saved)}</button>

}

function render(){renderNav();({trainen:renderTrainen,voortgang:renderVoortgang,gewicht:renderGewicht,eten:renderEten}[TAB])();scrollEl().scrollTop=0;}

/* ============ OVERLAYS ============ */
function closeOverlays(){document.querySelectorAll('.overlay,.player,.done,.sheet-scrim,.checklist').forEach(e=>e.remove());}

function openRoutine(id){
  const r=routineById(id);if(!r)return;closeOverlays();
  const gym=r.type==='reps';const steps=stepsFor(r);let n=0;
  const rows=steps.map(s=>{
    if(s.kind==='rest')return `<div class="step-r rest"><div class="si">·</div><div><div class="sn" style="color:var(--muted)">Rust</div></div><div class="st">${s.seconds}s</div></div>`;
    n++;const q=s.reps?`${s.sets} × ${s.reps}${s.name==='Plank'?'s':''}`:`${s.seconds}s`;
    return `<div class="step-r"><div class="si">${pad(n)}</div><div style="flex:1;min-width:0"><div class="sn">${s.name}${s.isNew?'<span class="newbadge">Nieuw</span>':''}</div><div class="sc">${s.cue}</div></div><div class="st" style="${gym?'color:var(--purple)':''}">${q}</div></div>`;
  }).join('');
  const meta=gym?`${n} oefeningen · met gewichten`:`${totalMin(r)} min · ${exCount(r)} oefeningen`;
  const cta=gym
    ?`<button class="btn purple" data-act="checklist:${r.id}">Afvinklijst starten \u2713</button>`
    :`<button class="btn accent" data-act="start:${r.id}">Start met timer \uD83D\uDD25</button><button class="btn ghost" data-act="checklist:${r.id}">Afvinklijst \u2713</button>`;
  const el=document.createElement('div');el.className='overlay';
  el.innerHTML=`
    <div class="ohead"><button class="iconbtn" data-act="closeov"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button><strong style="font-family:'Bricolage Grotesque';font-size:17px">Workout</strong></div>
    <div class="oscroll">
      <div class="detail-hero ${gym?'gym':''}"><span class="tag" style="display:inline-block;font-family:'Space Grotesk';font-weight:600;font-size:11px;letter-spacing:.12em;text-transform:uppercase;background:rgba(255,255,255,.22);padding:5px 10px;border-radius:100px">${r.focus}</span><h2>${r.name}</h2><div class="meta">${meta}</div></div>
      <div class="card" style="padding:6px 18px;margin-top:14px"><div class="steplist">${rows}</div></div>
      <p style="text-align:center;color:var(--muted);font-size:12px;margin:16px 6px 0;line-height:1.5">${gym?'Rust ongeveer 60\u201390 sec tussen sets. Kies een gewicht waarbij de laatste herhalingen pittig maar netjes zijn.':'Luister naar je lichaam. Pauzeer wanneer je wilt en pas oefeningen aan als iets niet fijn voelt.'}</p>
    </div>
    <div class="sticky-cta">${cta}</div>`;
  $('#app').appendChild(el);
}

/* ============ CHECKLIST MODE ============ */
let CL=null;
function openChecklist(id){
  const r=routineById(id);if(!r)return;closeOverlays();
  const steps=stepsFor(r).filter(s=>s.kind==='exercise');
  CL={routine:r,steps,done:new Set()};
  const el=document.createElement('div');el.className='overlay checklist';el.id='checklist';
  el.innerHTML=`
    <div class="ohead"><button class="iconbtn" data-act="closeov"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button><strong style="font-family:'Bricolage Grotesque';font-size:17px">${r.name}</strong></div>
    <div class="oscroll">
      <div class="clbar"><div id="cl-fill"></div></div>
      <div id="cl-count" style="text-align:center;color:var(--muted);font-size:13px;font-weight:600;margin-bottom:16px"></div>
      <div id="cl-list"></div>
    </div>
    <div class="sticky-cta"><button class="btn ${r.type==='reps'?'purple':'accent'}" data-act="finishcl">Workout afronden</button></div>`;
  $('#app').appendChild(el);
  drawChecklist();
}
function drawChecklist(){
  const r=CL.routine;
  $('#cl-list').innerHTML=CL.steps.map((s,i)=>{
    const on=CL.done.has(i);const q=s.reps?`${s.sets} × ${s.reps}${s.name==='Plank'?'s':''}`:`${s.seconds}s`;
    return `<button class="clrow ${on?'on':''}" data-act="cltoggle:${i}"><div class="box"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div style="flex:1;min-width:0"><div class="cn">${s.name}${s.isNew?'<span class="newbadge">Nieuw</span>':''}</div><div class="cc">${s.cue}</div></div><div class="cq">${q}</div></button>`;
  }).join('');
  const pct=Math.round(CL.done.size/CL.steps.length*100);
  $('#cl-fill').style.width=pct+'%';
  $('#cl-count').textContent=`${CL.done.size} van ${CL.steps.length} afgevinkt`;
}
function toggleCL(i){if(CL.done.has(i)){CL.done.delete(i);}else{CL.done.add(i);beep(760,0.08);}drawChecklist();}
function finishChecklist(){if(!CL)return;const r=CL.routine;finishWorkout(r);}

/* ============ TIMER PLAYER ============ */
let P=null;const RING_R=124,RING_C=2*Math.PI*RING_R;
function startWorkout(id){
  const r=routineById(id);if(!r||r.type!=='time')return;closeOverlays();
  try{if(!sound)sound=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}
  P={routine:r,steps:stepsFor(r),idx:0,left:0,paused:false,timer:null};P.left=P.steps[0].seconds;
  const el=document.createElement('div');el.className='player';el.id='player';
  el.innerHTML=`
    <div class="ptop"><div class="prog" id="p-prog"></div><button class="quit" data-act="quit"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button></div>
    <div class="ring-wrap"><div class="ring"><svg width="262" height="262" viewBox="0 0 262 262"><circle class="rbg" cx="131" cy="131" r="${RING_R}"/><circle class="rfg" id="p-ring" cx="131" cy="131" r="${RING_R}" stroke-dasharray="${RING_C}" stroke-dashoffset="0"/></svg><div class="center"><div class="num" id="p-num">0</div><div class="ph" id="p-phase">Oefening</div></div></div>
      <div class="exinfo"><div class="exn" id="p-exn"></div><div class="exc" id="p-exc"></div></div>
      <div class="nextup" id="p-next"></div></div>
    <div class="pctrl"><button class="pause" data-act="pause"><span id="p-pausel">Pauze</span></button><button class="skip" data-act="skip">Overslaan \u203A</button></div>`;
  $('#app').appendChild(el);applyStep();tickStart();
}
function nextExName(from){for(let i=from;i<P.steps.length;i++)if(P.steps[i].kind==='exercise')return P.steps[i].name;return null;}
function applyStep(){
  const s=P.steps[P.idx];const isRest=s.kind==='rest';$('#player').classList.toggle('rest',isRest);P.left=s.seconds;
  const exAll=P.steps.filter(x=>x.kind==='exercise');const curNum=P.steps.slice(0,P.idx+1).filter(x=>x.kind==='exercise').length;
  $('#p-prog').textContent=isRest?'Rust':`Oefening ${curNum}/${exAll.length}`;
  $('#p-phase').textContent=isRest?'Rust':'Oefening';
  $('#p-exn').innerHTML=isRest?'Even rust':(s.name+(s.isNew?'<span class="newbadge">Nieuw</span>':''));
  $('#p-exc').textContent=isRest?'Adem rustig en herstel.':s.cue;
  const nxt=nextExName(P.idx+1);$('#p-next').innerHTML=nxt?`Volgende: <b>${nxt}</b>`:'Bijna klaar!';
  $('#p-ring').setAttribute('stroke-dashoffset','0');updateNum();beep(isRest?520:760);
}
function updateNum(){const el=$('#p-num');if(!el)return;el.textContent=P.left>=60?fmtTime(P.left):P.left;const s=P.steps[P.idx];const frac=1-(P.left/s.seconds);const ring=$('#p-ring');if(ring)ring.setAttribute('stroke-dashoffset',(RING_C*frac).toFixed(1));}
function tickStart(){clearInterval(P.timer);P.timer=setInterval(()=>{if(P.paused)return;P.left--;if(P.left<=0)advance();else{updateNum();if(P.left<=3)beep(880,0.08);}},1000);}
function advance(){if(P.idx>=P.steps.length-1){clearInterval(P.timer);finishWorkout(P.routine);return;}P.idx++;applyStep();}
function pauseToggle(){P.paused=!P.paused;$('#p-pausel').textContent=P.paused?'Hervat':'Pauze';}
function quitWorkout(){if(P)clearInterval(P.timer);P=null;closeOverlays();}

/* ============ FINISH + FEEDBACK ============ */
async function finishWorkout(r){
  if(P){clearInterval(P.timer);}P=null;CL=null;
  const min=r.type==='reps'?Math.max(12,r.steps.length*4):totalMin(r);
  DB.history.push({date:todayISO(),id:r.id,name:r.name,min,emoji:r.emoji});await saveDB();
  const streak=computeStreak();closeOverlays();
  const el=document.createElement('div');el.className='done';el.id='done';
  el.innerHTML=`
    <div class="check"><svg width="42" height="42" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <h2>Goed bezig!</h2><p>Je hebt <b>${r.name}</b> afgerond. Elke workout telt.</p>
    <div class="stats"><div class="s"><div class="v">${min}</div><div class="l">minuten</div></div><div class="s"><div class="v">${streak}</div><div class="l">dagen reeks</div></div><div class="s"><div class="v">${DB.history.length}</div><div class="l">totaal</div></div></div>
    <div class="fbwrap" id="fb"><div class="fblabel">Hoe voelde deze workout?</div><div class="fbrow"><button data-act="fb:hard">Te zwaar</button><button data-act="fb:good">Precies goed</button><button data-act="fb:easy">Te makkelijk</button></div></div>`;
  $('#app').appendChild(el);
  beep(660,0.14);setTimeout(()=>beep(880,0.18),140);setTimeout(()=>beep(1046,0.24),300);
}
async function feedback(kind){
  if(kind==='easy')DB.diffFactor=Math.min(1.3,(DB.diffFactor||1)+0.1);
  else if(kind==='hard')DB.diffFactor=Math.max(0.8,(DB.diffFactor||1)-0.1);
  await saveDB();
  const msg=kind==='easy'?'Top — we maken je volgende workouts wat pittiger \uD83D\uDCAA':kind==='hard'?'Prima — we houden het volgende keer wat rustiger \uD83D\uDE4C':'Mooi, we houden dit niveau aan \u2728';
  const fb=$('#fb');if(fb)fb.innerHTML=`<p style="margin-bottom:16px">${msg}</p><button class="backbtn" data-act="donedismiss">Klaar</button>`;
}

/* ============ SHEETS ============ */
function openSheet(kind){
  closeSheet();const scrim=document.createElement('div');scrim.className='sheet-scrim';scrim.dataset.act='scrim';
  if(kind==='weight')scrim.innerHTML=`<div class="sheet"><h3>Gewicht loggen</h3><p>Voer je gewicht van vandaag in.</p><div class="field"><label>Gewicht (kg)</label><input id="w-input" type="number" inputmode="decimal" step="0.1" placeholder="bijv. 78.5" /></div><div class="sheet-btns"><button class="btn grey" data-act="closesheet">Annuleer</button><button class="btn blue" data-act="savew">Opslaan</button></div></div>`;
  else scrim.innerHTML=`<div class="sheet"><h3>Streefgewicht</h3><p>Vrijblijvend — puur als richtlijn op je grafiek.</p><div class="field"><label>Doel (kg)</label><input id="g-input" type="number" inputmode="decimal" step="0.1" placeholder="bijv. 72" value="${DB.goalKg||''}" /></div><div class="sheet-btns">${DB.goalKg?'<button class="btn grey" data-act="clearg">Wissen</button>':'<button class="btn grey" data-act="closesheet">Annuleer</button>'}<button class="btn blue" data-act="saveg">Opslaan</button></div></div>`;

}
function closeSheet(){document.querySelectorAll('.sheet-scrim').forEach(e=>e.remove());}
async function saveWeight(){const el=$('#w-input');const v=parseFloat(el.value.replace(',','.'));if(isNaN(v)||v<=0||v>400){el.style.borderColor='var(--accent)';return;}const d=todayISO();const ex=DB.weights.findIndex(w=>w.date===d);if(ex>=0)DB.weights[ex].kg=v;else DB.weights.push({date:d,kg:v});await saveDB();closeSheet();if(TAB==='gewicht')renderGewicht();}
async function saveGoal(){const el=$('#g-input');const v=parseFloat(el.value.replace(',','.'));if(isNaN(v)||v<=0||v>400){el.style.borderColor='var(--accent)';return;}DB.goalKg=v;await saveDB();closeSheet();renderGewicht();}
async function clearGoal(){DB.goalKg=null;await saveDB();closeSheet();renderGewicht();}
async function toggleSave(id){const i=DB.savedMeals.indexOf(id);if(i>=0)DB.savedMeals.splice(i,1);else{DB.savedMeals.push(id);beep(760,0.08);}await saveDB();renderEten();}

function openMeal(id){
  const m=findMeal(id);if(!m)return;closeOverlays();const saved=DB.savedMeals.includes(id);
  const el=document.createElement('div');el.className='overlay';
  el.innerHTML=`
    <div class="ohead"><button class="iconbtn" data-act="closeov"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button><strong style="font-family:'Bricolage Grotesque';font-size:17px">Recept</strong><button class="heart ${saved?'on':''}" data-act="save:${m.id}" style="margin-left:auto">${heartSVG(saved)}</button></div>
    <div class="oscroll">
      <div style="text-align:center;padding:10px 0 4px"><div style="font-size:60px">${m.emoji}</div><h2 style="font-family:'Bricolage Grotesque';font-weight:800;font-size:24px;margin:8px 0 2px">${m.name}</h2><div style="color:var(--muted);font-size:13px">${m.prep} · ${m.ing.length} ingrediënten</div></div>
      <div class="card" style="padding:18px;margin-top:14px"><h2 class="sec" style="margin:0 0 12px">Ingrediënten</h2>${m.ing.map(i=>`<div style="display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)"><span style="width:7px;height:7px;border-radius:50%;background:var(--mint);flex-shrink:0"></span><span style="font-size:14px">${i}</span></div>`).join('')}</div>
      <div class="card" style="padding:18px;margin-top:14px"><h2 class="sec" style="margin:0 0 12px">Bereiding</h2>${m.steps.map((s,i)=>`<div style="display:flex;gap:12px;padding:8px 0"><span style="font-family:'Space Grotesk';font-weight:700;color:var(--mint);flex-shrink:0">${i+1}</span><span style="font-size:14px;line-height:1.5">${s}</span></div>`).join('')}</div>

/* ============ EVENTS ============ */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const [cmd,arg]=t.dataset.act.split(':');
  switch(cmd){
    case 'tab':TAB=arg;render();break;
    case 'loc':LOC=arg;renderTrainen();break;
    case 'open':openRoutine(arg);break;
    case 'closeov':P=null;CL=null;closeOverlays();break;
    case 'start':startWorkout(arg);break;
    case 'checklist':openChecklist(arg);break;
    case 'cltoggle':toggleCL(+arg);break;
    case 'finishcl':finishChecklist();break;
    case 'pause':pauseToggle();break;
    case 'skip':advance();break;
    case 'quit':quitWorkout();break;
    case 'fb':feedback(arg);break;
    case 'donedismiss':closeOverlays();TAB='voortgang';render();break;
    case 'mcat':MCAT=arg;renderEten();break;
    case 'meal':openMeal(arg);break;
    case 'save':toggleSave(arg);break;
    case 'sheet':openSheet(arg);break;
    case 'closesheet':closeSheet();break;
    case 'savew':saveWeight();break;
    case 'saveg':saveGoal();break;
    case 'clearg':clearGoal();break;
    case 'scrim':closeSheet();break;
  }
});
document.addEventListener('click',e=>{if(e.target.closest('.sheet')&&!e.target.closest('[data-act]'))e.stopPropagation();},true);
